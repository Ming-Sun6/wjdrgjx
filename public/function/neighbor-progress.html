  <title>游戏进度查询-无尽冬日工具箱</title>
  <style>
    :root {
      --bg-1: #0b1220;
      --bg-2: #111a2e;
      --card: rgba(16, 24, 40, 0.78);
      --card-strong: rgba(20, 30, 50, 0.92);
      --border: rgba(148, 163, 184, 0.28);
      --text: #e6edf8;
      --muted: #93a4bf;
      --accent: #34d399;
      --accent-2: #60a5fa;
      --danger: #fb7185;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
      --table-grid: rgba(148, 163, 184, 0.34);
      --table-grid-strong: rgba(148, 163, 184, 0.58);
      --table-head-bg: rgba(15, 23, 42, 0.94);
      --table-head-text: #c6d4ea;
      --row-hover: rgba(96, 165, 250, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(900px 550px at 8% 0%, rgba(52, 211, 153, 0.14), transparent 52%),
        radial-gradient(900px 550px at 90% 12%, rgba(96, 165, 250, 0.18), transparent 52%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
      padding: 20px 16px 28px;
    }

    body.theme-light {
      --bg-1: #eaf2ff;
      --bg-2: #f8fbff;
      --card: rgba(255, 255, 255, 0.88);
      --card-strong: rgba(255, 255, 255, 0.96);
      --border: rgba(71, 85, 105, 0.38);
      --text: #0f172a;
      --muted: #475569;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
      --table-grid: rgba(71, 85, 105, 0.32);
      --table-grid-strong: rgba(71, 85, 105, 0.48);
      --table-head-bg: rgba(226, 232, 240, 0.96);
      --table-head-text: #0f172a;
      --row-hover: rgba(59, 130, 246, 0.12);
      background:
        radial-gradient(900px 550px at 8% 0%, rgba(52, 211, 153, 0.10), transparent 52%),
        radial-gradient(900px 550px at 90% 12%, rgba(96, 165, 250, 0.12), transparent 52%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
    }

    body.theme-light input[type="number"],
    body.theme-light input[type="date"] {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border-color: rgba(71, 85, 105, 0.46);
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .sub {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.9rem;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.86rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(96, 165, 250, 0.22);
      border-color: rgba(96, 165, 250, 0.6);
    }

    .theme-toggle {
      min-width: 108px;
      justify-content: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .page-tabs {
      display: flex;
      gap: 10px;
      margin: 0 0 14px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      width: fit-content;
      max-width: 100%;
    }

    .page-tab-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .page-tab-btn.active {
      color: var(--text);
      border-color: rgba(96, 165, 250, 0.6);
      background: rgba(96, 165, 250, 0.22);
    }

    .page-panel.hidden {
      display: none;
    }
    .card {
      background: linear-gradient(165deg, var(--card-strong), var(--card));
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .card h2 {
      font-size: 1.03rem;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label {
      color: var(--muted);
      font-size: 0.88rem;
      min-width: 110px;
    }

    input[type="number"],
    input[type="date"] {
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      min-width: 220px;
      outline: none;
    }

    input:focus {
      border-color: rgba(96, 165, 250, 0.8);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }

    .summary {
      margin: 8px 0 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .summary b {
      color: var(--text);
    }

    .table-wrap {
      overflow: auto;
      max-height: min(72vh, 860px);
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--table-grid-strong);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      font-size: 0.9rem;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--table-grid);
      border-right: 1px solid var(--table-grid);
      text-align: left;
      white-space: nowrap;
    }

    th:last-child,
    td:last-child {
      border-right: none;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--table-head-bg);
      z-index: 2;
      font-weight: 700;
      color: var(--table-head-text);
      border-bottom: 1px solid var(--table-grid-strong);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    /* 固定第一列表头左上角：纵向 + 横向同时 sticky */
    th:first-child {
      left: 0;
      z-index: 4;
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.08),
        8px 0 18px rgba(0, 0, 0, 0.10);
    }

    /* 固定第一列数据单元格（邻邦区间 / 里程碑名） */
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--card-strong);
      box-shadow: 8px 0 18px rgba(0, 0, 0, 0.10);
    }

    tbody tr:hover td:first-child {
      background-image: linear-gradient(
        rgba(96, 165, 250, 0.16),
        rgba(96, 165, 250, 0.16)
      );
    }

    tbody tr:last-child td:first-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .ok {
      color: var(--accent);
      font-weight: 700;
    }

    .warn {
      color: #fbbf24;
      font-weight: 700;
    }

    .bad {
      color: var(--danger);
      font-weight: 700;
    }

    .tiny {
      color: var(--muted);
      font-size: 0.83rem;
    }

    .highlight {
      background: rgba(52, 211, 153, 0.16);
    }

    .history-state {
      text-align: center;
      font-weight: 700;
      color: #f8fbff;
    }

    .history-state-empty {
      background: rgba(148, 163, 184, 0.10);
      color: #93a4bf;
      font-weight: 600;
    }

    .history-state-fc3 { background: rgba(251, 146, 60, 0.38); }
    .history-state-fc5 { background: rgba(249, 115, 22, 0.42); }
    .history-state-fc8 { background: rgba(234, 88, 12, 0.46); }
    .history-state-fc10 { background: rgba(194, 65, 12, 0.52); }

    .history-state-waracad { background: rgba(14, 165, 233, 0.42); }
    .history-state-hero4 { background: rgba(59, 130, 246, 0.40); }
    .history-state-hero5 { background: rgba(99, 102, 241, 0.42); }
    .history-state-hero6 { background: rgba(139, 92, 246, 0.42); }
    .history-state-hero7 { background: rgba(168, 85, 247, 0.44); }
    .history-state-hero8 { background: rgba(217, 70, 239, 0.42); }
    .history-state-hero9 { background: rgba(236, 72, 153, 0.42); }
    .history-state-hero10 { background: rgba(244, 63, 94, 0.44); }
    .history-state-hero11 { background: rgba(225, 29, 72, 0.46); }

    .foot {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      body {
        padding: 14px 10px 24px;
      }

      .title {
        font-size: 1.1rem;
      }

      .row {
        flex-direction: column;
        align-items: stretch;
      }

      label {
        min-width: 0;
      }

      input[type="number"],
      input[type="date"] {
        min-width: 0;
        width: 100%;
      }
    }
  
    @media (max-width: 760px) {
      .page-tabs {
        width: 100%;
      }

      .page-tab-btn {
        flex: 1;
        text-align: center;
      }
    }
  </style>

        var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(dateStr);
        if (!m) return NaN;
        var ms = Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        return Math.floor((ms - serialEpochUtc) / 86400000);
      }

      function getNeighborLabel(idx) {
        if (idx < 1 || idx > labels.length) return "";
        return labels[idx - 1];
      }

      function toDisplayLabel(label) {
        var m = /^NB(\d+)$/.exec(String(label || ""));
        if (m) return "\u7b2c" + m[1] + "\u90bb\u90a6";
        return label || "";
      }

      function toDisplayRangeForTable(label) {
        var t = String(label || "");
        if (/^\d+\s*~\s*\d+$/.test(t)) return t.replace("~", "\uFF5E");
        return t;
      }

      function getNeighborScheduleRowCount() {
        for (var i = 0; i < labels.length; i++) {
          if (/^NB\d+$/.test(String(labels[i] || ""))) return i;
        }
        return labels.length;
      }

      function toDisplayState(state) {
        if (!state) return "-";
        return stateLabelMap[state] || state;
      }

      function getHistoryStateClass(state) {
        if (!state) return "history-state-empty";
        if (state === "WarAcad") return "history-state-waracad";
        if (state === "Hero4") return "history-state-hero4";
        if (state === "Hero5") return "history-state-hero5";
        if (state === "Hero6") return "history-state-hero6";
        if (state === "Hero7") return "history-state-hero7";
        if (state === "Hero8") return "history-state-hero8";
        if (state === "Hero9") return "history-state-hero9";
        if (state === "Hero10") return "history-state-hero10";
        if (state === "Hero11") return "history-state-hero11";
        if (state === "FC3") return "history-state-fc3";
        if (state === "FC5") return "history-state-fc5";
        if (state === "FC8") return "history-state-fc8";
        if (state === "FC10") return "history-state-fc10";
        return "history-state-empty";
      }

      function getTodaySerial() {
        var now = new Date();
        var ms = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        return Math.floor((ms - serialEpochUtc) / 86400000);
      }

      function toOpenCountdownText(targetSerial, todaySerial) {
        if (!Number.isFinite(targetSerial)) return "-";
        var d = Number.isFinite(todaySerial) ? todaySerial : getTodaySerial();
        var diff = targetSerial - d;
        if (diff <= 0) return "\u5df2\u5f00\u653e";
        return "\u8ddd\u79bb\u5f00\u653e\u8fd8\u6709" + diff + "\u5929";
      }

      function findScheduleRangeIndex(serverId) {
        var rowCount = getNeighborScheduleRowCount();
        for (var i = 0; i < rowCount; i++) {
          if (rangeContains(labels[i], serverId)) return i;
        }
        return -1;
      }

      function renderProgress() {
        var input = document.getElementById("neighborInput");
        var summary = document.getElementById("neighborSummary");
        var progressTableBody = document.getElementById("progressTableBody");
        if (!input || !summary || !progressTableBody) return;

        var serverId = Number(input.value);
        if (!Number.isFinite(serverId)) serverId = 1;
        serverId = Math.max(1, Math.floor(serverId));
        input.value = serverId;

        var rangeIdx = findScheduleRangeIndex(serverId);
        if (rangeIdx < 0) {
          summary.innerHTML = "\u5f53\u524d\u533a\u670d\uff1a<b>" + serverId + "</b>\uff0c\u672a\u547d\u4e2d\u53c2\u8003\u533a\u95f4\u3002";
          progressTableBody.innerHTML = "<tr><td colspan=\"3\">\u65e0\u5339\u914d\u6570\u636e</td></tr>";
          return;
        }

        var rangeLabel = toDisplayRangeForTable(labels[rangeIdx]);
        summary.innerHTML = "\u5f53\u524d\u533a\u670d\uff1a<b>" + serverId + "</b>\uff0c\u5339\u914d\u533a\u95f4\uff1a<b>" + rangeLabel + "</b>\u3002";

        var html = "";
        var todaySerial = getTodaySerial();
        var opens = getStageOpenSerialsForRange(rangeIdx);
        for (var j = 0; j < stageDefs.length; j++) {
          var stage2 = stageDefs[j];
          var serial2 = opens[j];
          html += "<tr>" +
            "<td>" + stage2.name + "</td>" +
            "<td>" + serialToDateStr(serial2) + "</td>" +
            "<td>" + toOpenCountdownText(serial2, todaySerial) + "</td>" +
            "</tr>";
        }
        progressTableBody.innerHTML = html;
      }

      function renderFullScheduleTable() {
        var fullScheduleHead = document.getElementById("fullScheduleHead");
        var fullScheduleBody = document.getElementById("fullScheduleBody");
        if (!fullScheduleHead || !fullScheduleBody) return;

        var head = "<tr><th>\u90bb\u90a6</th>";
        for (var h = 0; h < stageDefs.length; h++) {
          head += "<th>" + stageDefs[h].name + "</th>";
        }
        head += "</tr>";
        fullScheduleHead.innerHTML = head;

        var body = "";
        var rowCount = getNeighborScheduleRowCount();
        for (var r = 0; r < rowCount; r++) {
          var raw = labels[r];
          var rangeLabel = toDisplayRangeForTable(raw);
          body += "<tr><td>" + rangeLabel + "</td>";
          var opensRow = getStageOpenSerialsForRange(r);
          for (var c2 = 0; c2 < stageDefs.length; c2++) {
            body += "<td>" + serialToShortDate(opensRow[c2]) + "</td>";
          }
          body += "</tr>";
        }
        fullScheduleBody.innerHTML = body;
      }

      function rangeContains(rangeText, value) {
        if (!rangeText || !Number.isFinite(value)) return false;
        var t = String(rangeText).trim();
        var m1 = t.match(/^NB(\d+)$/);
        if (m1) return Number(m1[1]) === value;
        var m2 = t.match(/^(\d+)\s*~\s*(\d+)$/);
        if (m2) {
          var a = Number(m2[1]);
          var b = Number(m2[2]);
          if (a > b) {
            var c = a;
            a = b;
            b = c;
          }
          return value >= a && value <= b;
        }
        var m3 = t.match(/^(\d+)$/);
        if (m3) return Number(m3[1]) === value;
        return false;
      }

      function renderHistory(filterNum) {
        var historyHead = document.getElementById("historyHead");
        var historyBody = document.getElementById("historyBody");
        if (!historyHead || !historyBody) return;

        var head = "<tr><th>\u90bb\u90a6\u533a\u95f4</th>";
        for (var i = 0; i < historyDateMarks.length; i++) {
          var mark = historyDateMarks[i];
          head += "<th>" + (typeof mark === "number" ? serialToDateStr(mark) : String(mark || "")) + "</th>";
        }
        head += "</tr>";
        historyHead.innerHTML = head;

        var body = "";
        for (var r = 0; r < historyRows.length; r++) {
          var row = historyRows[r];
          var cls = "";
          if (Number.isFinite(filterNum) && rangeContains(row.range, filterNum)) {
            cls = " class=\"highlight\"";
          }
          body += "<tr" + cls + "><td>" + toDisplayLabel(row.range) + "</td>";
          for (var c = 0; c < row.states.length; c++) {
            var state = row.states[c];
            var stateText = toDisplayState(state);
            var stateClass = "history-state " + getHistoryStateClass(state);
            body += "<td class=\"" + stateClass + "\">" + stateText + "</td>";
          }
          body += "</tr>";
        }
        historyBody.innerHTML = body;
      }

      function bindPageTabs() {
        var tabs = document.querySelectorAll("#pageTabs .page-tab-btn");
        var pages = {
          progress: document.getElementById("pageProgress"),
          history: document.getElementById("pageHistory")
        };

        function setActivePage(pageKey) {
          var targetKey = pages[pageKey] ? pageKey : "progress";

          for (var key in pages) {
            if (!Object.prototype.hasOwnProperty.call(pages, key)) continue;
            if (pages[key]) {
              pages[key].classList.toggle("hidden", key !== targetKey);
            }
          }

          for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle("active", tabs[i].getAttribute("data-page") === targetKey);
          }
        }

        for (var i = 0; i < tabs.length; i++) {
          tabs[i].addEventListener("click", function () {
            setActivePage(this.getAttribute("data-page"));
          });
        }

        setActivePage("progress");
      }
      function bindEvents() {
        var neighborQueryBtn = document.getElementById("neighborQueryBtn");
        var neighborInput = document.getElementById("neighborInput");
        if (neighborQueryBtn) {
          neighborQueryBtn.addEventListener("click", renderProgress);
        }
        if (neighborInput) {
          neighborInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") renderProgress();
          });
        }

        var filterBtn = document.getElementById("filterBtn");
        var clearFilterBtn = document.getElementById("clearFilterBtn");
        var rangeFilter = document.getElementById("rangeFilter");
        if (filterBtn && rangeFilter) {
          filterBtn.addEventListener("click", function () {
            var n = Number(rangeFilter.value);
            if (!Number.isFinite(n)) return renderHistory(NaN);
            renderHistory(Math.floor(n));
          });
        }
        if (clearFilterBtn && rangeFilter) {
          clearFilterBtn.addEventListener("click", function () {
            rangeFilter.value = "";
            renderHistory(NaN);
          });
        }
      }
      function init() {
        renderFullScheduleTable();
        renderProgress();
        renderHistory(NaN);
        bindPageTabs();
        bindEvents();
      }

      init();
    })();
  </script>
