  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

  <script src="/function/farthest-migration-range.js?v=20260904-2"></script>
  <script>
  (function(){
    var api = window.WjdrFarthestMigration;
    var schedule = api.buildSchedule();
    var historyConfig = { dates: api.DEFAULT_HISTORY_DATES.map(function(date){ return { date: date, enabled: true }; }), intervalDays: api.DEFAULT_HISTORY_INTERVAL_DAYS, rules: { displayOffsetDays: api.DEFAULT_DISPLAY_OFFSET_DAYS } };
    var serverInput = document.getElementById("serverInput");
    var targetInput = document.getElementById("targetInput");
    var originSummary = document.getElementById("originSummary");
    var compareSummary = document.getElementById("compareSummary");

    function escapeHtml(value){
      return String(value == null ? "" : value)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function zonePill(value, bad){
      if (value == null || value === "") return "—";
      if (bad) return "<span class=\"pill no zone\">" + escapeHtml(value) + "</span> ❌";
      return "<span class=\"pill ok zone\">" + escapeHtml(value) + "</span>";
    }

    function reachLine(prefix, reach){
      if (!reach) return prefix + "：" + zonePill("");
      return prefix + "：" + zonePill(reach.server);
    }

    function readQuery(){
      try {
        var params = new URLSearchParams(window.location.search);
        var server = Number(params.get("server") || params.get("s") || params.get("id"));
        var target = Number(params.get("target") || params.get("t"));
        if (Number.isFinite(server) && server > 0) serverInput.value = String(server);
        if (Number.isFinite(target) && target > 0) targetInput.value = String(target);
      } catch (_error) {}
    }

    function render(){
      var originId = Number(serverInput.value);
      var targetId = Number(targetInput.value);
      var current = api.lookupCurrent(schedule, originId);
      if (current.error || !current.origin){
        originSummary.textContent = "找不到这个区对应的邻邦区间，请核对区号。";
        compareSummary.textContent = "先输入有效区号。";
        return;
      }
      var origin = current.origin;
      var furnace = current.furnace;
      originSummary.innerHTML =
        "<div><strong>" + origin.server + "</strong> · " + escapeHtml(furnace.name) + "</div>" +
        "<div class=\"reach-line\">" + reachLine("往前最远区", current.older) + "</div>" +
        "<div class=\"reach-line\">" + reachLine("往后最远区", current.newer) + "</div>";

      if (!Number.isFinite(targetId) || targetId <= 0){
        compareSummary.textContent = "填写目标区后，按移民预测同期分组看下期最远能到哪。";
        return;
      }
      var plan = api.planHopsToTarget(schedule, originId, targetId, { historyConfig: historyConfig });
      if (plan.error){
        compareSummary.textContent = "目标区不在邻邦表里。";
        return;
      }
      if (plan.alreadyThere){
        compareSummary.innerHTML = "目标区就是本区 " + zonePill(origin.server) + "，不用移民。";
        return;
      }
      if (!plan.steps.length){
        compareSummary.textContent = "暂无后续移民期次，无法继续推算。";
        return;
      }
      var items = plan.steps.map(function(step){
        var lineClass = step.overCap ? " class=\"over-cap\"" : "";
        var note = step.overCap ? "" : (step.reached ? " · 到达目标" : "");
        return "<li" + lineClass + "><strong>" + escapeHtml(step.label) + "</strong>（" + escapeHtml(step.date) +
          "）：最远 " + zonePill(step.to, step.overCap) + note + "</li>";
      }).join("");
      var tail = "";
      if (plan.reached) {
        var hit = plan.steps.filter(function(step){ return step.reached; }).pop();
        tail = "能到 " + zonePill(plan.target.server) + (hit ? "，" + escapeHtml(hit.label) + "可达" : "") + "。";
      } else if (plan.beyondSpan || (plan.steps.length && plan.steps[plan.steps.length - 1].overCap)) {
        tail = "到不了 " + zonePill(plan.target.server, true) + "，超过" +
          (plan.direction === "older" ? "往前" : "往后") + "最远区 " + zonePill(plan.capServer) + "。";
      } else {
        tail = "到不了 " + zonePill(plan.target.server) + "，同期分组还盖不到。";
      }
      compareSummary.innerHTML = "<ul class=\"hop-list\">" + items + "</ul>" + tail;
    }

    document.getElementById("runBtn").addEventListener("click", render);
    serverInput.addEventListener("keydown", function(event){ if (event.key === "Enter") render(); });
    targetInput.addEventListener("keydown", function(event){ if (event.key === "Enter") render(); });
    readQuery();
    var remote = typeof fetch === "function"
      ? Promise.all([
          fetch("/api/neighbor-progress", { credentials: "include", cache: "no-store" }).then(function(response){
            return response.ok ? response.json() : null;
          }).catch(function(){ return null; }),
          fetch("/api/history-immigration", { credentials: "include", cache: "no-store" }).then(function(response){
            return response.ok ? response.json() : null;
          }).catch(function(){ return null; })
        ])
      : Promise.resolve([null, null]);
    remote.then(function(payloads){
      if (payloads && payloads[0]) schedule = api.applyNeighborProgress(payloads[0]);
      if (payloads && payloads[1]) historyConfig = payloads[1];
      render();
    });
  })();
  </script>
