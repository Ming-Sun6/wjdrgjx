  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

    :root{
      --bg-night-1:#0b1220;
      --bg-night-2:#0f172a;
      --bg-day-1:#f1f5ff;
      --bg-day-2:#fefce8;
      --glow-night-1:rgba(59,130,246,.25);
      --glow-night-2:rgba(139,92,246,.22);
      --glow-day-1:rgba(56,189,248,.22);
      --glow-day-2:rgba(251,191,36,.18);
      --surface-night:rgba(15,23,42,.75);
      --surface-day:rgba(255,255,255,.85);
      --border-night:rgba(255,255,255,.12);
      --border-day:rgba(15,23,42,.12);
      --text-night:#e2e8f0;
      --text-day:#0f172a;
      --muted-night:#94a3b8;
      --muted-day:#475569;
      --accent:#3b82f6;
      --shadow-soft:0 10px 24px rgba(15,23,42,.16);
    }
    html[data-theme="night"]{
      --bg1:var(--bg-night-1);
      --bg2:var(--bg-night-2);
      --glow-1:var(--glow-night-1);
      --glow-2:var(--glow-night-2);
      --surface:var(--surface-night);
      --border:var(--border-night);
      --text:var(--text-night);
      --muted:var(--muted-night);
      color-scheme:dark;
    }
    html[data-theme="day"]{
      --bg1:var(--bg-day-1);
      --bg2:var(--bg-day-2);
      --glow-1:var(--glow-day-1);
      --glow-2:var(--glow-day-2);
      --surface:var(--surface-day);
      --border:var(--border-day);
      --text:var(--text-day);
      --muted:var(--muted-day);
      color-scheme:light;
    }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%, var(--glow-1), transparent 55%),
        radial-gradient(900px 600px at 85% 20%, var(--glow-2), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      transition:background .4s ease,color .25s ease;
    }
    .notice{
      max-width:560px;
      margin:16px;
      padding:18px 20px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--surface);
      box-shadow:var(--shadow-soft);
      text-align:center;
      line-height:1.6;
    }
    .notice a{color:var(--accent);text-decoration:none;}
    .theme-toggle{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:10010;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text);
      padding:8px 12px;
      border-radius:999px;
      font-size:.8rem;
      font-weight:700;
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(10px);
      cursor:pointer;
    }
  </style>
