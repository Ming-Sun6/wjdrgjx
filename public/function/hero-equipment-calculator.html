  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

  <style>
:root {
      --bg1: #0a1426;
      --bg2: #13253b;
      --card: rgba(15, 23, 42, 0.8);
      --card2: rgba(15, 23, 42, 0.92);

    }
    :root[data-theme="day"] {
      --bg1: #eef6ff;
      --bg2: #fff5ea;
      --card: rgba(255, 255, 255, 0.82);
      --card2: rgba(255, 255, 255, 0.94);
      --line: rgba(15, 23, 42, 0.15);
      --text: #0f172a;
      --muted: #475569;
      --a1: #0284c7;
      --a2: #ea580c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Bahnschrift", "DIN Alternate", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;

        radial-gradient(1200px 620px at 10% -12%, rgba(6, 182, 212, 0.24), transparent 58%),

      font-size: 12px;

      padding: 7px 11px;
      backdrop-filter: blur(8px);
    }
    #homeBtn { left: 10px; }
    #themeBtn { right: 10px; cursor: pointer; }
    .wrap { max-width: 1220px; margin: 0 auto; display: grid; gap: 12px; padding-top: 40px; }
    .hero, .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 20px 46px rgba(2, 6, 23, 0.36);
      backdrop-filter: blur(8px);
    }
    .hero { padding: 22px 18px; }
    .hero h1 { font-size: clamp(24px, 4vw, 38px); margin-bottom: 10px; line-height: 1.1; }
    .hero p { color: var(--muted); line-height: 1.62; font-size: 14px; max-width: 900px; }
    .chips { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); background: var(--card2); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 4px 10px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      padding: 9px 13px;
      cursor: pointer;
    }
    .tab.active { background: linear-gradient(105deg, var(--a1), #0ea5e9); color: #fff; border-color: transparent; }
    .panel { display: none; padding: 12px; gap: 10px; }
    .panel.active { display: grid; animation: rise .25s ease both; }
    .box { border: 1px solid var(--line); border-radius: 12px; background: var(--card2); padding: 11px; display: grid; gap: 8px; }
    .box h3 { font-size: 15px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; align-items: end; }
    .f { grid-column: span 3; display: grid; gap: 5px; }
    .f2 { grid-column: span 2; display: grid; gap: 5px; }
    .f label, .f2 label { font-size: 12px; color: var(--muted); font-weight: 800; }
    .f input, .f2 input, .f select, .f2 select {
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.24);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 9px;
      font-size: 14px;
      outline: none;

    :root[data-theme="day"] .f2 input,
    :root[data-theme="day"] .f select,
    :root[data-theme="day"] .f2 select { background: rgba(255, 255, 255, 0.9); }
    .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    .stat { border: 1px solid var(--line); border-radius: 10px; padding: 9px; background: rgba(15, 23, 42, 0.3); }
    :root[data-theme="day"] .stat { background: rgba(255, 255, 255, 0.9); }
    .k { color: var(--muted); font-size: 12px; }
    .v { font-size: 21px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid var(--line); padding: 7px; text-align: left; }
    th { background: rgba(15, 23, 42, 0.54); }

    .res-name { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }

  <main class="wrap">
    <section class="hero">
      <h1>英雄装备计算器</h1>
      <p>专注英雄装备与专精成长，单独查看螺丝、专精石、橙装、秘银与属性增量。</p>
      <div class="chips">
        <span class="chip">英雄装备升级</span>
        <span class="chip">专精成长</span>
        <span class="chip">属性增量</span>
      </div>
    </section>

    <section class="panel active" data-panel="hero">
      <div class="box">
        <h3>英雄装备升级</h3>
        <div class="grid">
          <div class="f"><label>当前装备等级</label><select id="heroFrom"></select></div>
          <div class="f"><label>目标装备等级</label><select id="heroTo"></select></div>
          <div class="f2"><label>当前专精等级</label><select id="spFrom"></select></div>
          <div class="f2"><label>目标专精等级</label><select id="spTo"></select></div>
        </div>
        <div class="stats">
          <div class="stat"><div class="k">螺丝 (/100)</div><div class="v" id="hScrew">0</div></div>
          <div class="stat"><div class="k">专精石</div><div class="v" id="hStone">0</div></div>
          <div class="stat"><div class="k">橙装</div><div class="v" id="hOrange">0</div></div>
          <div class="stat"><div class="k">秘银</div><div class="v" id="hMithril">0</div></div>
          <div class="stat"><div class="k">当前属性</div><div class="v" id="hAttrNow">0</div></div>
          <div class="stat"><div class="k">目标属性</div><div class="v" id="hAttrTo">0</div></div>
        </div>
        <div class="hint" id="heroMeta"></div>
      </div>
      <div class="status" id="heroStatus">就绪</div>
    </section>
  </main>

  <script>
    const N = (v)=>{ const n = Number(v); return Number.isFinite(n) ? n : null; };
        const F = (v,d=2)=>Number.isFinite(v) ? v.toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d}) : "--";
        const I = (v)=>Number.isFinite(v) ? v.toLocaleString("zh-CN") : "--";
        const YW = (yiVal)=>{
          if(!Number.isFinite(yiVal)) return "--";
          if(yiVal >= 1) return `${yiVal.toFixed(1)}亿`;
          return `${(yiVal * 10000).toFixed(1)}万`;
        };
        const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
        const txt = (id,v)=>{ const el = document.getElementById(id); if(el) el.textContent = String(v); };
        const sumRange = (s,e,fn)=>{ let t=0; if(e<=s) return 0; for(let i=s+1;i<=e;i++) t+=fn(i); return t; };



    function heroScrewAt(lv){
          if(lv<1||lv>200) return 0;
          if(lv<=29) return 5*lv+5; if(lv<=39) return 10*lv-140; if(lv<=59) return 20*lv-530;
          if(lv<=69) return 680+(lv-60)*30; if(lv<=79) return 990+(lv-70)*40; if(lv<=99) return 1400+(lv-80)*50;
          if(lv===100) return 2400;
          if([101,120,140,160,180,200].includes(lv)) return 0;
          if(lv<=119) return 2500+(lv-102)*50; if(lv<=139) return 3500+(lv-121)*50;
          if(lv<=159) return 4450+(lv-141)*50; if(lv<=179) return 5500+(lv-161)*100;
          return 7500+(lv-181)*100;
        }
        function heroMithrilAt(lv){ if(lv===120)return 10; if(lv===140)return 20; if(lv===160)return 30; if(lv===180)return 40; if(lv===200)return 50; return 0; }
        function heroOrangeAt(lv){ if(lv===101)return 2; if(lv===120)return 3; if(lv===140||lv===160)return 5; if(lv===180||lv===200)return 10; return 0; }
        function heroAttrAt(lv){ return lv<=100 ? 0.0333 + (0.5-0.0333)/100*lv : 0.5 + (lv-100)*0.5/100; }
        function specStoneAt(lv){ return lv>=1&&lv<=20 ? lv*10 : 0; }
        function specOrangeAt(lv){ return lv>=11&&lv<=20 ? lv-10 : 0; }



    function recalcHero(){
          const hf = clamp(Math.round(N(document.getElementById("heroFrom").value) ?? 1), 1, 200);
          const ht = clamp(Math.round(N(document.getElementById("heroTo").value) ?? 1), 1, 200);
          const sf = clamp(Math.round(N(document.getElementById("spFrom").value) ?? 1), 1, 20);
          const st = clamp(Math.round(N(document.getElementById("spTo").value) ?? 1), 1, 20);
          const screw = sumRange(hf,ht,heroScrewAt)/100;
          const mithril = sumRange(hf,ht,heroMithrilAt);
          const orange = sumRange(hf,ht,heroOrangeAt) + sumRange(sf,st,specOrangeAt);
          const stone = sumRange(sf,st,specStoneAt);
          const attrNow = heroAttrAt(hf)*(1+sf*0.1), attrTo = heroAttrAt(ht)*(1+st*0.1);
          txt("hScrew", F(screw,2)); txt("hStone", I(stone)); txt("hOrange", I(orange)); txt("hMithril", I(mithril));
          txt("hAttrNow", F(attrNow,4)); txt("hAttrTo", F(attrTo,4));
          txt("heroMeta", `属性增量: ${F(attrTo-attrNow,4)} | 装备 ${hf} -> ${ht} | 专精 ${sf} -> ${st}`);
          if(ht<hf||st<sf){ txt("heroStatus","目标等级低于当前等级，材料按 0 处理"); document.getElementById("heroStatus").className = "status warn"; }
          else { txt("heroStatus","英雄装备计算已更新"); document.getElementById("heroStatus").className = "status ok"; }
        }



    function init(){
      const hOpts = Array.from({length:200}, (_, i)=>({v:i+1,l:String(i+1)}));
      const sOpts = Array.from({length:20}, (_, i)=>({v:i+1,l:String(i+1)}));
      const setOptions = (id, opts, value)=>{
        const el = document.getElementById(id);
        el.innerHTML = opts.map((o)=>`<option value="${o.v}">${o.l}</option>`).join("");
        el.value = String(value);
      };
      setOptions("heroFrom", hOpts, 1);
      setOptions("heroTo", hOpts, 1);
      setOptions("spFrom", sOpts, 1);
      setOptions("spTo", sOpts, 1);

      ["heroFrom","heroTo","spFrom","spTo"].forEach((id)=>document.getElementById(id).addEventListener("input", recalcHero));
      recalcHero();
    }
    init();
  </script>
