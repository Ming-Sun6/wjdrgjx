  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

    <script>
        // 登录/注册（JWT HttpOnly Cookie）
        var authUser = null, authChecked = false;
        async function apiFetch(url, opts) {
            return await fetch(url, { credentials: 'include', ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
        }
        function updateAuthUI() {
            var p = document.getElementById('authPill'), L = document.getElementById('btnLogin'), O = document.getElementById('btnLogout');
            if (!p || !L || !O) return;
            if (authUser) { p.textContent = '已登录：' + authUser.username; L.style.display = 'none'; O.style.display = ''; }
            else { p.textContent = '未登录'; L.style.display = ''; O.style.display = 'none'; }
        }
        function openAuthModal() {
            var m = document.getElementById('authModal');
            if (m) { m.classList.add('open'); m.setAttribute('aria-hidden', 'false'); document.getElementById('authError').textContent = ''; document.getElementById('authUsername').value = ''; document.getElementById('authPassword').value = ''; setTimeout(function () { document.getElementById('authUsername').focus(); }, 0); }
        }
        function closeAuthModal() {
            var m = document.getElementById('authModal');
            if (m) { m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); }
        }
        async function refreshMe() {
            try { var r = await apiFetch('/api/auth/me', { method: 'GET' }); var d = await r.json(); authUser = (d && d.authenticated) ? d.user : null; } catch (e) { authUser = null; }
            authChecked = true; updateAuthUI();
        }
        function mapAuthApiError(msg) {
            var v = String(msg || '');
            if (v === 'INVALID_CREDENTIALS') return '用户名或密码错误';
            if (v === 'USERNAME_TAKEN') return '用户名已被占用';
            if (v === 'PASSWORD_RULE') return '密码格式不符合要求';
            if (v === 'PASSWORD_WEAK') return '密码过于简单，请更换';
            if (v === 'BANNED') return '账号已被拉黑';
            if (v === 'CAPTCHA_REQUIRED') return '请先完成验证码';
            if (v === 'CAPTCHA_INVALID') return '验证码参数无效，请重试';
            if (v === 'CAPTCHA_RETRY' || v === 'CAPTCHA_FAILED') return '验证码未通过，请重试';
            if (v === 'CAPTCHA_VERIFY_ERROR') return '验证码服务繁忙，请稍后重试';
            if (v === 'CAPTCHA_NOT_CONFIGURED') return '验证码服务未配置';
            return v || '登录/注册失败';
        }
        async function doLoginOrRegister(mode) {
            var u = (document.getElementById('authUsername').value || '').trim(), p = (document.getElementById('authPassword').value || '').trim(), err = document.getElementById('authError');
            if (!u || !p) { if (err) err.textContent = '请输入用户名和密码'; return; }
            if (u.length < 3 || u.length > 32) { if (err) err.textContent = '用户名3-32位'; return; }
            if (p.length < 6 || p.length > 72) { if (err) err.textContent = '密码6-72位'; return; }
            try {
                var payload = { username: u, password: p };
                var r = await apiFetch(mode === 'register' ? '/api/auth/register' : '/api/auth/login', { method: 'POST', body: JSON.stringify(payload) });
                var d = await r.json();
                if (!r.ok) { if (err) err.textContent = mapAuthApiError(d.error || ''); return; }
                authUser = d.user || null; authChecked = true; closeAuthModal(); updateAuthUI();
            } catch (e) { if (err) err.textContent = '网络错误'; }
        }
        async function logout() { try { await apiFetch('/api/auth/logout', { method: 'POST', body: '{}' }); } catch (e) {} authUser = null; updateAuthUI(); }
        document.getElementById('btnLogin') && document.getElementById('btnLogin').addEventListener('click', openAuthModal);
        document.getElementById('btnLogout') && document.getElementById('btnLogout').addEventListener('click', logout);
        document.getElementById('authClose') && document.getElementById('authClose').addEventListener('click', closeAuthModal);
        document.getElementById('authModal') && document.getElementById('authModal').addEventListener('click', function (e) { if (e.target && e.target.id === 'authModal') closeAuthModal(); });
        document.getElementById('authDoLogin') && document.getElementById('authDoLogin').addEventListener('click', function () { doLoginOrRegister('login'); });
        document.getElementById('authDoRegister') && document.getElementById('authDoRegister').addEventListener('click', function () { doLoginOrRegister('register'); });
        refreshMe();

        // 移民券对应规则：min=系数下限，max=系数上限，coupons=所需券数（完整 1~50）
        const couponRules = [];
        for (let c = 1; c <= 10; c++) {
            couponRules.push({
                min: (c - 1) * 0.05,
                max: c * 0.05,
                coupons: c
            });
        }
        for (let c = 11; c <= 20; c++) {
            couponRules.push({
                min: 0.5 + (c - 11) * 0.025,
                max: 0.5 + (c - 10) * 0.025,
                coupons: c
            });
        }
        for (let c = 21; c <= 45; c++) {
            couponRules.push({
                min: 0.75 + (c - 21) * 0.01,
                max: 0.75 + (c - 20) * 0.01,
                coupons: c
            });
        }
        for (let c = 46; c <= 49; c++) {
            couponRules.push({
                min: 1 + (c - 46) * 0.01,
                max: 1 + (c - 45) * 0.01,
                coupons: c
            });
        }
        couponRules.push({ min: 1.04, max: Infinity, coupons: 50 });

        function formatRuleNumber(value) {
            return Number(value).toFixed(3).replace(/\.?0+$/, '');
        }

        function renderCouponRulesTable() {
            const tbody = document.getElementById('couponRulesTableBody');
            if (!tbody) return;
            tbody.innerHTML = couponRules.map(rule => (
                `<tr><td>${formatRuleNumber(rule.min)}</td><td>${Number.isFinite(rule.max) ? formatRuleNumber(rule.max) : '∞'}</td><td>${rule.coupons}</td></tr>`
            )).join('');
        }
        renderCouponRulesTable();

        // 重置错误提示和输入样式
        function resetError() {
            const inputs = document.querySelectorAll('input');
            const tips = document.querySelectorAll('.error-tip');
            inputs.forEach(input => input.classList.remove('error'));
            tips.forEach(tip => tip.style.display = 'none');
        }

        // 显示错误提示
        function showError(id) {
            document.getElementById(id).classList.add('error');
            document.getElementById(`${id}Tip`).style.display = 'block';
        }

        function calculate() {
            resetError();
            // 获取输入值并校验
            const totalPower = parseFloat(document.getElementById('totalPower').value);
            const troopPower = parseFloat(document.getElementById('troopPower').value);
            const furnaceCoeff = parseFloat(document.getElementById('furnaceLevel').value);
            const kingdomStandard = parseFloat(document.getElementById('progress').value);

            if (isNaN(totalPower) || totalPower <= 0) {
                showError('totalPower');
                return;
            }
            if (isNaN(troopPower) || troopPower < 0 || troopPower > totalPower) {
                showError('troopPower');
                return;
            }

            // 核心计算逻辑（完全匹配游戏规则）
            const hardPower = totalPower - troopPower; // 硬实力=总实力-部队实力
            const immigrationScore = hardPower * furnaceCoeff; // 移民评分=硬实力×炉子系数
            const immigrationCoefficient = immigrationScore / kingdomStandard; // 移民系数=移民评分÷王国基准值

            // 匹配移民券（精准匹配系数区间）
            let requiredCoupons = 0;
            for (const rule of couponRules) {
                if (immigrationCoefficient >= rule.min && immigrationCoefficient < rule.max) {
                    requiredCoupons = rule.coupons;
                    break;
                }
            }

            // 展示结果（千分位分隔+系数保留4位小数，更易读）
            document.getElementById('hardPower').textContent = hardPower.toLocaleString();
            document.getElementById('immigrationScore').textContent = immigrationScore.toLocaleString();
            document.getElementById('immigrationCoefficient').textContent = immigrationCoefficient.toFixed(4);
            document.getElementById('requiredCoupons').textContent = requiredCoupons;
        }
</script>
