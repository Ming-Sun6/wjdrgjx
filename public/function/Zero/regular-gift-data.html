<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>常规礼包-无尽冬日工具箱</title>
  <style>
    :root{
      --bg:#edf2f7;
      --card:#ffffff;
      --card-2:#f8fafc;
      --card-3:#f1f5f9;
      --border:#d1d9e6;
      --table-border:#dbe3ef;
      --text:#0f172a;
      --text-2:#1f2937;
      --muted:#64748b;
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --accent-soft:#eff6ff;
      --hover-soft:#f8fbff;
      --focus-ring:rgba(59,130,246,.14);
    }
    html[data-theme="night"]{
      --bg:#0b1220;
      --card:rgba(15,23,42,.92);
      --card-2:rgba(15,23,42,.78);
      --card-3:rgba(148,163,184,.10);
      --border:rgba(148,163,184,.22);
      --table-border:rgba(148,163,184,.22);
      --text:#e5e7eb;
      --text-2:#e5e7eb;
      --muted:#9ca3af;
      --accent:#60a5fa;
      --accent-2:#93c5fd;
      --accent-soft:rgba(96,165,250,.14);
      --hover-soft:rgba(148,163,184,.08);
      --focus-ring:rgba(59,130,246,.22);
      color-scheme:dark;
    }
    html[data-theme="day"]{color-scheme:light;}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    /* 统一：所有组件使用变量，避免写死颜色导致不随主题 */
    .wrap{
      max-width:1120px;
      margin:0 auto;
      padding:18px 12px 24px;
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .theme-toggle{
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      border-radius:999px;
      width:42px;
      height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 10px 26px rgba(15,23,42,.12);
    }
    .theme-toggle svg{width:20px;height:20px;fill:currentColor;opacity:.9;}
    h1{
      margin:0;
      font-size:28px;
      font-weight:900;
    }
    .back{
      text-decoration:none;
      color:var(--text);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:8px;
      padding:8px 12px;
      font-size:14px;
      font-weight:700;
    }
    .search-bar{
      display:flex;
      gap:8px;
      margin-bottom:8px;
    }
    .search-input{
      flex:1;
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 12px;
      font-size:14px;
      background:var(--card);
      color:var(--text);
      outline:none;
    }
    .search-input:focus{
      border-color:var(--accent-2);
      box-shadow:0 0 0 3px var(--focus-ring);
    }
    .search-clear{
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 12px;
      font-size:13px;
      font-weight:700;
      background:var(--card-2);
      color:var(--text);
      cursor:pointer;
      white-space:nowrap;
    }
    .meta{
      margin:0 0 10px;
      color:var(--muted);
      font-size:13px;
    }
    .layout{
      display:grid;
      grid-template-columns:300px minmax(0,1fr);
      gap:10px;
      align-items:start;
    }
    .left,
    .right{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
    }
    .left{
      padding:10px;
      position:sticky;
      top:10px;
      max-height:calc(100vh - 28px);
      overflow:auto;
    }
    .gift-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .gift-item{
      text-align:left;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      border-radius:9px;
      padding:10px 10px;
      cursor:pointer;
      font-size:14px;
      font-weight:700;
      line-height:1.35;
    }
    .gift-item:hover{
      border-color:var(--accent-2);
      background:var(--hover-soft);
    }
    .gift-item.active{
      border-color:var(--accent-2);
      background:var(--accent-soft);
      color:var(--accent);
    }
    .empty-left{
      display:none;
      text-align:center;
      color:var(--muted);
      font-size:14px;
      font-weight:700;
      border:1px dashed var(--border);
      border-radius:10px;
      padding:14px 8px;
      background:var(--card-2);
    }
    .right{
      padding:12px;
    }
    .detail-title{
      margin:0 0 6px;
      font-size:24px;
      font-weight:900;
      color:var(--accent);
    }
    .detail-note{
      margin:0 0 10px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
      font-weight:700;
    }
    .section{
      margin-top:10px;
      border:1px solid var(--border);
      border-radius:10px;
      overflow:hidden;
      background:var(--card);
    }
    .section-title{
      margin:0;
      padding:8px 10px;
      background:var(--card-3);
      color:var(--text);
      font-size:16px;
      font-weight:800;
    }
    .table-wrap{
      overflow:auto;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:460px;
      font-size:14px;
    }
    th,td{
      border:1px solid var(--table-border);
      padding:8px 9px;
      text-align:center;
      white-space:nowrap;
    }
    th{
      background:var(--card-2);
      font-weight:800;
      color:var(--text);
    }
    td{
      color:var(--text-2);
      font-weight:700;
    }
    .tip{
      margin:10px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.4;
    }
    .gift-inline-detail{
      display:none;
      margin-top:-2px;
      margin-bottom:6px;
      padding:10px;
      border:1px solid var(--border);
      border-radius:0 0 12px 12px;
      background:var(--hover-soft);
    }
    .gift-inline-detail .detail-note{
      margin:0 0 10px;
    }
    @media (max-width: 920px){
      .layout{grid-template-columns:1fr;}
      .left{position:static;max-height:none;}
      .right{display:none;}
      .gift-item.active{border-radius:9px 9px 0 0;}
      .gift-inline-detail{display:block;}
    }
  </style>
  <script src="/function/analytics-tracker.js" defer></script>
  <link rel="stylesheet" href="/function/mobile-responsive.css" />
  <link rel="stylesheet" href="/function/theme.css" />
  <script src="/function/theme.js" defer></script>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1>常规礼包</h1>
      <div class="top-actions">
        <a class="back" href="../../rukou.html">返回首页</a>
      </div>
    </div>
    <div class="search-bar">
      <input id="searchInput" class="search-input" type="search" placeholder="搜索礼包名称或内容关键词" />
      <button id="clearBtn" class="search-clear" type="button">清空</button>
    </div>
    <p id="meta" class="meta"></p>
    <div class="layout">
      <aside class="left">
        <div id="giftList" class="gift-list"></div>
        <div id="emptyLeft" class="empty-left">未找到匹配礼包</div>
      </aside>
      <section class="right">
        <h2 id="detailTitle" class="detail-title">请选择礼包</h2>
        <p id="detailNote" class="detail-note" style="display:none;"></p>
        <div id="detailBody"></div>
        <p class="tip">提示：先在左侧搜索礼包，再点击礼包名称查看对应内容。</p>
      </section>
    </div>
  </main>
  <script src="gift-data-page.js"></script>
  <script>
    initGiftDataPage({ category: "regular" });
  </script>

  <style id="wjdr-footer-inline">:root{--wjdr-thanks-text:"制作：2041茗子、飞菇\A数据：飞菇、甜甜、627贰叁、奶酪、719缥缈、2041茗子\A测试：2041茗子、飞菇、甜甜、627贰叁、奶酪、719缥缈、755脆脆、2144煤球、柒枫团队\A宣传大使：懒羊羊\A赞助：39 拙山枯水大江行\A\A感谢以上所有人对本攻略站的付出"}

html[data-theme="day"] footer.wjdr-footer::before,body.theme-day footer.wjdr-footer::before{border-color:rgba(15,23,42,.14);background:rgba(255,255,255,.5);color:#64748b}

footer.wjdr-footer{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:100%;box-sizing:border-box;align-self:stretch;flex-shrink:0;margin-top:1.75rem;margin-left:0;margin-right:0;padding:14px 18px 22px;text-align:center;font-size:12px;line-height:1.65;font-weight:400;letter-spacing:.02em;-webkit-font-smoothing:antialiased;color:var(--muted,#94a3b8);border-top:1px solid var(--border,rgba(148,163,184,.28));background:rgba(15,23,42,.28)}
footer.wjdr-footer .site-footer-legal{margin:0 auto;padding:0;width:100%;max-width:min(100%,52rem);text-align:center;display:block}
@supports (text-wrap:balance){footer.wjdr-footer .site-footer-legal{text-wrap:balance}}
footer.wjdr-footer .site-footer-sep{margin:0 .35em;opacity:.45;font-weight:300}
footer.wjdr-footer a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;opacity:.95;transition:color .15s ease,opacity .15s ease}
footer.wjdr-footer a:hover{opacity:1;color:var(--text,#e2e8f0)}
html[data-theme="day"] footer.wjdr-footer{color:var(--muted,#475569);border-top-color:var(--border,rgba(15,23,42,.14));background:rgba(255,255,255,.45)}
html[data-theme="day"] footer.wjdr-footer a:hover{color:var(--text,#0f172a)}
body.theme-day footer.wjdr-footer{color:var(--muted,#64748b);border-top-color:rgba(15,23,42,.12);background:rgba(255,255,255,.35)}
body.theme-day footer.wjdr-footer a:hover{color:var(--text,#1e293b)}
@media (max-width:600px){footer.wjdr-footer{font-size:11px;padding:12px 14px 18px}}
body>footer.wjdr-footer{align-self:stretch;max-width:none}
</style>
