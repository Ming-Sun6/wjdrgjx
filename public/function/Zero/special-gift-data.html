  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>特惠礼包-无尽冬日工具箱</title>
  <style>
    :root{
      --bg:#edf2f7;
      --card:#ffffff;
      --card-2:#f8fafc;
      --card-3:#f1f5f9;
      --border:#d1d9e6;
      --table-border:#dbe3ef;
      --text:#0f172a;
      --text-2:#1f2937;
      --muted:#64748b;
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --accent-soft:#eff6ff;
      --hover-soft:#f8fbff;
      --focus-ring:rgba(59,130,246,.14);
    }
    html[data-theme="night"]{
      --bg:#0b1220;
      --card:rgba(15,23,42,.92);
      --card-2:rgba(15,23,42,.78);
      --card-3:rgba(148,163,184,.10);
      --border:rgba(148,163,184,.22);
      --table-border:rgba(148,163,184,.22);
      --text:#e5e7eb;
      --text-2:#e5e7eb;
      --muted:#9ca3af;
      --accent:#60a5fa;
      --accent-2:#93c5fd;
      --accent-soft:rgba(96,165,250,.14);
      --hover-soft:rgba(148,163,184,.08);
      --focus-ring:rgba(59,130,246,.22);
      color-scheme:dark;
    }
    html[data-theme="day"]{color-scheme:light;}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    /* 统一：所有组件使用变量，避免写死颜色导致不随主题 */
    .wrap{
      max-width:1120px;
      margin:0 auto;
      padding:18px 12px 24px;
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .theme-toggle{
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      border-radius:999px;
      width:42px;
      height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 10px 26px rgba(15,23,42,.12);
    }
    .theme-toggle svg{width:20px;height:20px;fill:currentColor;opacity:.9;}
    h1{
      margin:0;
      font-size:28px;
      font-weight:900;
    }
    .back{
      text-decoration:none;
      color:var(--text);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:8px;
      padding:8px 12px;
      font-size:14px;
      font-weight:700;
    }
    .search-bar{
      display:flex;
      gap:8px;
      margin-bottom:8px;
    }
    .search-input{
      flex:1;
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 12px;
      font-size:14px;
      background:var(--card);
      color:var(--text);
      outline:none;
    }
    .search-input:focus{
      border-color:var(--accent-2);
      box-shadow:0 0 0 3px var(--focus-ring);
    }
    .search-clear{
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 12px;
      font-size:13px;
      font-weight:700;
      background:var(--card-2);
      color:var(--text);
      cursor:pointer;
      white-space:nowrap;
    }
    .meta{
      margin:0 0 10px;
      color:var(--muted);
      font-size:13px;
    }
    .layout{
      display:grid;
      grid-template-columns:300px minmax(0,1fr);
      gap:10px;
      align-items:start;
    }
    .left,
    .right{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
    }
    .left{
      padding:10px;
      position:sticky;
      top:10px;
      max-height:calc(100vh - 28px);
      overflow:auto;
    }
    .gift-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .gift-item{
      text-align:left;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      border-radius:9px;
      padding:10px 10px;
      cursor:pointer;
      font-size:14px;
      font-weight:700;
      line-height:1.35;
    }
    .gift-item:hover{
      border-color:var(--accent-2);
      background:var(--hover-soft);
    }
    .gift-item.active{
      border-color:var(--accent-2);
      background:var(--accent-soft);
      color:var(--accent);
    }
    .empty-left{
      display:none;
      text-align:center;
      color:var(--muted);
      font-size:14px;
      font-weight:700;
      border:1px dashed var(--border);
      border-radius:10px;
      padding:14px 8px;
      background:var(--card-2);
    }
    .right{
      padding:12px;
    }
    .detail-title{
      margin:0 0 6px;
      font-size:24px;
      font-weight:900;
      color:var(--accent);
    }
    .detail-note{
      margin:0 0 10px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
      font-weight:700;
    }
    .section{
      margin-top:10px;
      border:1px solid var(--border);
      border-radius:10px;
      overflow:hidden;
      background:var(--card);
    }
    .section-title{
      margin:0;
      padding:8px 10px;
      background:var(--card-3);
      color:var(--text);
      font-size:16px;
      font-weight:800;
    }
    .table-wrap{
      overflow:auto;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:460px;
      font-size:14px;
    }
    th,td{
      border:1px solid var(--table-border);
      padding:8px 9px;
      text-align:center;
      white-space:nowrap;
    }
    th{
      background:var(--card-2);
      font-weight:800;
      color:var(--text);
    }
    td{
      color:var(--text-2);
      font-weight:700;
    }
    .tip{
      margin:10px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.4;
    }
    .gift-inline-detail{
      display:none;
      margin-top:-2px;
      margin-bottom:6px;
      padding:10px;
      border:1px solid var(--border);
      border-radius:0 0 12px 12px;
      background:var(--hover-soft);
    }
    .gift-inline-detail .detail-note{
      margin:0 0 10px;
    }
    @media (max-width: 920px){
      .layout{grid-template-columns:1fr;}
      .left{position:static;max-height:none;}
      .right{display:none;}
      .gift-item.active{border-radius:9px 9px 0 0;}
      .gift-inline-detail{display:block;}
    }
  </style>

      const searchInput = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearBtn");
      const meta = document.getElementById("meta");
      const listEl = document.getElementById("giftList");
      const emptyLeft = document.getElementById("emptyLeft");
      const detailTitle = document.getElementById("detailTitle");
      const detailNote = document.getElementById("detailNote");
      const detailBody = document.getElementById("detailBody");

      let filtered = packs.slice();
      let activeName = "";
      let expandedNames = new Set();

      function normalizeText(value){
        return String(value || "")
          .toLowerCase()
          .replace(/[\s·•\-_.，。、；;：:（）()【】\[\]《》<>]/g, "");
      }

      function textOfPack(pack){
        const base = [pack.name, pack.detail || "", pack.note || ""];
        (pack.sections || []).forEach((section) => {
          base.push(section.title || "");
          (section.columns || []).forEach((c) => base.push(c));
        });
        return normalizeText(base.join(" "));
      }

      function renderTable(section){
        const cols = section.columns || [];
        const rows = section.rows || [];
        const th = ["礼包价格"].concat(cols).map((c) => `<th>${c}</th>`).join("");
        const body = rows.map((row) => {
          const cells = row.map((v) => `<td>${v}</td>`).join("");
          return `<tr>${cells}</tr>`;
        }).join("");
        return `<div class="section"><h3 class="section-title">${section.title || "礼包内容"}</h3><div class="table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div></div>`;
      }

      function renderDetailMarkup(pack){
        if (!pack) return "";
        const noteHtml = pack.note ? `<p class="detail-note">${pack.note}</p>` : "";
        const sectionsHtml = pack.sections && pack.sections.length
          ? pack.sections.map(renderTable).join("")
          : `<div class="section"><h3 class="section-title">礼包内容</h3><div style="padding:12px;color:#334155;font-size:14px;font-weight:700;">${pack.detail || "待补充"}</div></div>`;
        return `${noteHtml}${sectionsHtml}`;
      }

      function isMobileLayout(){
        return window.matchMedia("(max-width: 920px)").matches;
      }

      function syncSelectionForLayout(){
        if (isMobileLayout()){
          expandedNames = new Set(filtered.filter((p) => expandedNames.has(p.name)).map((p) => p.name));
          return;
        }
        if (!filtered.some((p) => p.name === activeName)){
          activeName = filtered.length ? filtered[0].name : "";
        }
      }

      function renderDetail(name){
        const pack = packs.find((p) => p.name === name);
        if (!pack){
          detailTitle.textContent = "请选择礼包";
          detailNote.style.display = "none";
          detailBody.innerHTML = "";
          return;
        }
        detailTitle.textContent = pack.name;

        if (pack.note){
          detailNote.textContent = pack.note;
          detailNote.style.display = "block";
        } else {
          detailNote.style.display = "none";
        }

        detailBody.innerHTML = renderDetailMarkup(pack);
      }

      function renderList(){
        listEl.innerHTML = filtered.map((pack) => {
          const isExpanded = isMobileLayout() ? expandedNames.has(pack.name) : pack.name === activeName;
          const activeCls = isExpanded ? " active" : "";
          const inlineDetail = isMobileLayout() && expandedNames.has(pack.name)
            ? `<div class="gift-inline-detail">${renderDetailMarkup(pack)}</div>`
            : "";
          return `<button class="gift-item${activeCls}" type="button" data-name="${pack.name}">${pack.name}</button>${inlineDetail}`;
        }).join("");
        emptyLeft.style.display = filtered.length ? "none" : "block";
        meta.textContent = searchInput.value.trim() ? `匹配到 ${filtered.length} 个礼包` : `共 ${packs.length} 个礼包`;
      }

      function doFilter(){
        const q = normalizeText(searchInput.value.trim());
        filtered = q ? packs.filter((p) => textOfPack(p).includes(q)) : packs.slice();
        syncSelectionForLayout();
        renderList();
        renderDetail(activeName);
      }

      listEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".gift-item");
        if (!btn) return;
        const nextName = btn.getAttribute("data-name") || "";
        if (isMobileLayout()){
          if (expandedNames.has(nextName)) {
            expandedNames.delete(nextName);
          } else {
            expandedNames.add(nextName);
          }
        } else {
          activeName = nextName;
        }
        renderList();
        renderDetail(activeName);
      });

      window.addEventListener("resize", () => {
        syncSelectionForLayout();
        renderList();
        renderDetail(activeName);
      });

      searchInput.addEventListener("input", doFilter);
      clearBtn.addEventListener("click", function(){
        searchInput.value = "";
        searchInput.focus();
        doFilter();
      });

      try{
        var sp = new URLSearchParams(location.search);
        var qq = sp.get("q");
        var pick = sp.get("pack");
        if (qq !== null && qq !== undefined) searchInput.value = qq;
        syncSelectionForLayout();
        doFilter();
        if (pick){
          var hit = filtered.some((p) => p.name === pick);
          if (hit){
            if (isMobileLayout()) expandedNames = new Set([pick]);
            else activeName = pick;
            renderList();
            renderDetail(activeName);
          }
        }
      }catch(e){
        syncSelectionForLayout();
        doFilter();
      }
    })();
  </script>
