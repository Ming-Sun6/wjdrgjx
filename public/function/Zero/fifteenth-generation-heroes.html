  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();

    }

      --bg2:#f8fbff;
      --glow1:rgba(59,130,246,.20);
      --glow2:rgba(16,185,129,.14);

      --muted:#475569;

      color:var(--text);
      overflow-x:hidden;
    }
    .page{

      margin:0 auto;
      padding:16px 12px 30px;
    }
    .top{

      align-items:center;

      gap:12px;

      letter-spacing:.02em;
      text-shadow:0 2px 8px rgba(2,6,23,.2);
      margin:0;
    }
    .back{
      text-decoration:none;
      color:var(--back-text);
      background:var(--back-bg);
      border:1px solid var(--border);
      padding:8px 12px;
      border-radius:8px;
      font-size:14px;
      font-weight:700;
    }
    .small{
      color:var(--muted);
      font-size:.86rem;
      margin:0 0 14px;
      line-height:1.6;
      padding:8px 10px;
      border:1px dashed var(--border);
      border-radius:10px;
      background:rgba(148,163,184,.08);
    }
    .hero-list{
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .card{

      border-radius:12px;
      padding:14px;

      backdrop-filter:blur(8px);

      align-items:baseline;
      flex-wrap:wrap;
      gap:8px 18px;
      margin-bottom:10px;
    }
    .hero-intro{
      display:grid;
      grid-template-columns:minmax(0,1fr) 280px;
      gap:12px;
      align-items:stretch;
      margin-bottom:4px;
    }
    .hero-main{
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .hero-name{
      color:var(--hero-red);
      font-size:clamp(1.9rem, 4vw, 2.8rem);
      line-height:1.05;
      font-weight:900;
      letter-spacing:.02em;

    .hero-attr{

      border-radius:12px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      min-height:210px;
      overflow:hidden;
    }
    .hero-image{
      width:100%;
      max-width:260px;
      height:auto;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 14px 18px rgba(2,6,23,.22));
    }
    .hero-image-missing{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      user-select:none;
    }
    .info{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:2px;
    }
    .info-col{
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:10px;
      background:rgba(148,163,184,.08);

      grid-column:1 / -1;
    }

      font-weight:800;
      letter-spacing:.04em;
      color:var(--blue);

      line-height:1.58;

      overflow-wrap:anywhere;
      word-break:break-word;

      margin-bottom:10px;

      left:0;
      right:0;
      bottom:0;
      height:6px;

      line-height:1.65;
      font-weight:650;
      color:var(--text);

      word-break:break-word;

    .theme-toggle-btn{

      bottom:14px;

      width:40px;
      height:40px;
      margin:0;
      padding:0;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--back-bg);
      color:var(--back-text);
      box-shadow:0 10px 22px rgba(2,6,23,.28);

      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .22s ease, background-color .22s ease;
    }
    .theme-toggle-btn:hover{
      transform:translateY(-2px) scale(1.04);
      box-shadow:0 14px 30px rgba(37,99,235,.28);
    }
    .theme-toggle-btn:active{
      transform:translateY(0) scale(.96);
    }
    .theme-icon{
      width:20px;
      height:20px;
      display:block;
      fill:currentColor;
      pointer-events:none;
    }
    @media (max-width: 860px){
      .hero-intro{grid-template-columns:minmax(0,1fr) 220px;}
      .hero-image-wrap{min-height:170px;}
      .hero-image{max-width:205px;}
      .info h3{font-size:clamp(1.1rem, 2.9vw, 1.35rem);}

    }
    @media (max-width: 680px){
      .top{flex-wrap:wrap;align-items:flex-start;}
      .page{padding:12px 8px 24px;}
      .hero-intro{grid-template-columns:minmax(0,1fr) 168px;}
      .hero-image-wrap{min-height:140px;}
      .hero-image{max-width:150px;}
      .info{gap:6px;}
      .info-col{padding:8px 8px;}
      .info h3{font-size:1rem;letter-spacing:0;}
      .line{font-size:.9rem;letter-spacing:0;}
      .line-obtain{font-size:.86rem;letter-spacing:0;}
      .obtain-grid{gap:2px 8px;}
      .skill-tabs{gap:6px;}
      .skill-tab{font-size:.92rem;padding-bottom:6px;}
      .back{font-size:13px;}
    }
    @media (max-width: 420px){
      .hero-intro{grid-template-columns:minmax(0,1fr) 136px;gap:10px;}
      .hero-image-wrap{min-height:120px;}
      .hero-image{max-width:118px;}
      .info h3{font-size:.92rem;}
      .line{font-size:.82rem;}
      .line-obtain{font-size:.78rem;}
      .skill-tab{font-size:.82rem;}
    }

    const skillTypes = [
      { key: "explore", label: "探险技能" },
      { key: "expedition", label: "远征技能" },
      { key: "weapon", label: "专属武器" }
    ];

    function renderLines(list, lineClass){
      const cls = lineClass || "line";
      return list.map((text) => `<p class="${cls}">${text}</p>`).join("");
    }

    function renderExpeditionStats(list){
      const source = Array.isArray(list) ? list : [];
      if(source.length >= 2 && source.length % 2 === 0){
        let html = "";
        for(let i=0;i<source.length;i+=2){
          html += `<p class="line">${source[i]}</p>`;
          html += `<p class="line">${source[i+1]}</p>`;
        }
        return html;
      }
      return renderLines(source);
    }

    function renderSkillItems(list){
      return list.map((item) => {
        const lines = item.lines.map((line) => `<p class="skill-line">${line}</p>`).join("");
        return `<article class="skill-item"><h4>${item.name}</h4>${lines}</article>`;
      }).join("");
    }

    function renderObtainWays(list){
      const linesHtml = renderLines(list, "line line-obtain");
      if ((list || []).length >= 5){
        return `<div class="obtain-grid">${linesHtml}</div>`;
      }
      return linesHtml;
    }

    function renderHero(hero, heroIndex){
      const tabs = skillTypes.map((type, idx) => {
        return `<button class="skill-tab${idx===0 ? " active" : ""}" type="button" data-hero-index="${heroIndex}" data-skill-type="${type.key}">${type.label}</button>`;
      }).join("");
      const panels = skillTypes.map((type, idx) => {
        const list = hero.skills[type.key] || [];
        return `
          <section class="skill-panel${idx===0 ? " active" : ""}" data-hero-index="${heroIndex}" data-skill-type="${type.key}">
            <div class="skill-list">${renderSkillItems(list)}</div>
          </section>
        `;
      }).join("");
      const imageHtml = hero.image
        ? `<img class="hero-image" src="${hero.image}" alt="${hero.name}" loading="lazy" />`
        : `<div class="hero-image-missing">待补图</div>`;

      return `
        <section class="card">
          <div class="hero-intro">
            <div class="hero-main">
              <div class="hero-head">
                <div class="hero-name">${hero.name}</div>
                <div class="hero-attr">${hero.attr}</div>
              </div>
              <div class="recommend">${hero.advice}</div>
              <div class="info">
                <div class="info-col">
                  <h3>探险</h3>
                  ${renderLines(hero.exploreStats)}
                </div>
                <div class="info-col">
                  <h3>远征</h3>
                  ${renderExpeditionStats(hero.expeditionStats)}
                </div>
                <div class="info-col info-col-obtain">
                  <h3>获取方式</h3>
                  ${renderObtainWays(hero.obtainWays)}
                </div>
              </div>
            </div>
            <div class="hero-image-wrap">
              ${imageHtml}
            </div>
          </div>
          <div class="skill-tabs">${tabs}</div>
          ${panels}
        </section>
      `;
    }

    heroListEl.innerHTML = heroes.map((hero, index) => renderHero(hero, index)).join("");

    heroListEl.addEventListener("click", (event) => {
      const btn = event.target.closest(".skill-tab");
      if (!btn) return;
      const card = btn.closest(".card");
      if (!card) return;
      const targetType = btn.getAttribute("data-skill-type");
      const heroIndex = btn.getAttribute("data-hero-index");
      if (!targetType || heroIndex === null) return;

      card.querySelectorAll(".skill-tab").forEach((tab) => {
        tab.classList.toggle(
          "active",
          tab.getAttribute("data-skill-type") === targetType &&
          tab.getAttribute("data-hero-index") === heroIndex
        );
      });
      card.querySelectorAll(".skill-panel").forEach((panel) => {
        panel.classList.toggle(
          "active",
          panel.getAttribute("data-skill-type") === targetType &&
          panel.getAttribute("data-hero-index") === heroIndex
        );
      });
    });
  </script>
