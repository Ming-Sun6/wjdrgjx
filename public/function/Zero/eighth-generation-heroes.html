  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

    html[data-theme="day"]{

      --bg2:#f8fbff;
      --glow1:rgba(59,130,246,.20);

    .page{

      margin:0;

    .back{

      color:var(--back-text);
      background:var(--back-bg);
      border:1px solid var(--border);
      padding:8px 12px;
      border-radius:8px;
      font-size:14px;
      font-weight:700;
    }
    .small{
      color:var(--muted);
      font-size:.86rem;
      margin:0 0 14px;

      padding:8px 10px;

    .hero-intro{

      gap:12px;
      align-items:stretch;
      margin-bottom:4px;
    }
    .hero-main{
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .hero-name{

      justify-content:center;

      overflow:hidden;

    .hero-image{

      padding:0;

      color:var(--back-text);

      justify-content:center;

    }
    .theme-toggle-btn:hover{

    }
    .theme-toggle-btn:active{

      height:20px;
      display:block;
      fill:currentColor;
      pointer-events:none;

      .hero-image{max-width:150px;}

      .info h3{font-size:1rem;letter-spacing:0;}

      .line-obtain{font-size:.86rem;letter-spacing:0;}
      .obtain-grid{gap:2px 8px;}

      .hero-image-wrap{min-height:120px;}
      .hero-image{max-width:118px;}
      .info h3{font-size:.92rem;}
      .line{font-size:.82rem;}
      .line-obtain{font-size:.78rem;}
      .skill-tab{font-size:.82rem;}
    }

      const cls = lineClass || "line";
      return list.map((text) => `<p class="${cls}">${text}</p>`).join("");

        for(let i=0;i<source.length;i+=2){
          html += `<p class="line">${source[i]}</p>`;
          html += `<p class="line">${source[i+1]}</p>`;
        }
        return html;
      }
      return renderLines(source);
    }

    function renderSkillItems(list){
      return list.map((item) => {
        const lines = item.lines.map((line) => `<p class="skill-line">${line}</p>`).join("");
        return `<article class="skill-item"><h4>${item.name}</h4>${lines}</article>`;
      }).join("");
    }

    function renderObtainWays(list){
      const linesHtml = renderLines(list, "line line-obtain");
      if ((list || []).length >= 5){
        return `<div class="obtain-grid">${linesHtml}</div>`;
      }
      return linesHtml;
    }

    function renderHero(hero, heroIndex){
      const tabs = skillTypes.map((type, idx) => {
        return `<button class="skill-tab${idx===0 ? " active" : ""}" type="button" data-hero-index="${heroIndex}" data-skill-type="${type.key}">${type.label}</button>`;
      }).join("");
      const panels = skillTypes.map((type, idx) => {
        const list = hero.skills[type.key] || [];
        return `
          <section class="skill-panel${idx===0 ? " active" : ""}" data-hero-index="${heroIndex}" data-skill-type="${type.key}">
            <div class="skill-list">${renderSkillItems(list)}</div>
          </section>
        `;
      }).join("");
      const imageHtml = hero.image
        ? `<img class="hero-image" src="${hero.image}" alt="${hero.name}" loading="lazy" />`
        : `<div class="hero-image-missing">待补图</div>`;

      return `
        <section class="card">
          <div class="hero-intro">
            <div class="hero-main">
              <div class="hero-head">
                <div class="hero-name">${hero.name}</div>
                <div class="hero-attr">${hero.attr}</div>
              </div>
              <div class="recommend">${hero.advice}</div>
              <div class="info">
                <div class="info-col">
                  <h3>探险</h3>
                  ${renderLines(hero.exploreStats)}
                </div>
                <div class="info-col">
                  <h3>远征</h3>
                  ${renderExpeditionStats(hero.expeditionStats)}
                </div>
                <div class="info-col info-col-obtain">
                  <h3>获取方式</h3>
                  ${renderObtainWays(hero.obtainWays)}
                </div>
              </div>
            </div>
            <div class="hero-image-wrap">
              ${imageHtml}
            </div>
          </div>
          <div class="skill-tabs">${tabs}</div>
          ${panels}
        </section>
      `;
    }

    heroListEl.innerHTML = heroes.map((hero, index) => renderHero(hero, index)).join("");

    heroListEl.addEventListener("click", (event) => {
      const btn = event.target.closest(".skill-tab");
      if (!btn) return;
      const card = btn.closest(".card");
      if (!card) return;
      const targetType = btn.getAttribute("data-skill-type");
      const heroIndex = btn.getAttribute("data-hero-index");
      if (!targetType || heroIndex === null) return;

      card.querySelectorAll(".skill-tab").forEach((tab) => {
        tab.classList.toggle(
          "active",
          tab.getAttribute("data-skill-type") === targetType &&
          tab.getAttribute("data-hero-index") === heroIndex
        );
      });
      card.querySelectorAll(".skill-panel").forEach((panel) => {
        panel.classList.toggle(
          "active",
          panel.getAttribute("data-skill-type") === targetType &&
          panel.getAttribute("data-hero-index") === heroIndex
        );
      });
    });
  </script>
