<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英雄数据-冬日工具箱</title>
  <style>
    :root{
      --bg:#edf2f7;
      --card:#ffffff;
      --card-2:#f8fafc;
      --border:#d1d9e6;
      --text:#0f172a;
      --muted:#64748b;
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --focus-ring:rgba(59,130,246,.14);
      --tag-border:#bfdbfe;
      --tag-bg:#eff6ff;
      --tag-muted-border:#cbd5e1;
      --tag-muted-bg:#f8fafc;
    }
    html[data-theme="night"]{
      --bg:#0b1220;
      --card:rgba(15,23,42,.92);
      --card-2:rgba(15,23,42,.78);
      --border:rgba(148,163,184,.22);
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#60a5fa;
      --accent-2:#93c5fd;
      --focus-ring:rgba(59,130,246,.22);
      --tag-border:rgba(147,197,253,.42);
      --tag-bg:rgba(96,165,250,.14);
      --tag-muted-border:rgba(148,163,184,.28);
      --tag-muted-bg:rgba(148,163,184,.10);
      color-scheme:dark;
    }
    html[data-theme="day"]{color-scheme:light;}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{
      max-width:900px;
      margin:0 auto;
      padding:20px 14px 30px;
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }
    h1{
      margin:0;
      font-size:28px;
      font-weight:900;
    }
    .back{
      text-decoration:none;
      color:var(--text);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:8px;
      padding:8px 12px;
      font-size:14px;
      font-weight:700;
    }
    .search-bar{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 8px;
    }
    .search-input{
      flex:1;
      min-width:0;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      border-radius:10px;
      padding:10px 12px;
      font-size:14px;
      line-height:1.2;
      outline:none;
    }
    .search-input:focus{
      border-color:var(--accent-2);
      box-shadow:0 0 0 3px var(--focus-ring);
    }
    .search-clear{
      border:1px solid var(--border);
      background:var(--card-2);
      color:var(--text);
      border-radius:10px;
      padding:10px 12px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }
    .search-meta{
      margin:0 0 12px;
      color:var(--muted);
      font-size:13px;
      line-height:1.4;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
      gap:12px;
    }
    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px;
      transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .card:hover{
      transform:translateY(-2px);
      border-color:var(--accent-2);
      box-shadow:0 12px 28px rgba(37,99,235,.12);
    }
    .title{
      font-size:20px;
      font-weight:900;
      margin:0 0 8px;
      color:var(--accent);
    }
    .desc{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }
    .tag{
      display:inline-block;
      margin-top:10px;
      font-size:12px;
      font-weight:700;
      color:var(--accent);
      border:1px solid var(--tag-border);
      background:var(--tag-bg);
      border-radius:999px;
      padding:4px 9px;
    }
    .tag.pending{
      color:var(--muted);
      border-color:var(--tag-muted-border);
      background:var(--tag-muted-bg);
    }
    .empty-state{
      display:none;
      padding:18px 12px;
      border:1px dashed var(--border);
      border-radius:12px;
      color:var(--muted);
      text-align:center;
      background:var(--card-2);
      font-size:14px;
      font-weight:700;
    }
  </style>
  <script src="/function/analytics-tracker.js" defer></script>
  <link rel="stylesheet" href="/function/mobile-responsive.css" />
  <style id="wjdr-mobile-density">
    @media (min-width: 340px) and (max-width: 768px) {
      #heroGrid { grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:9px; }
      #heroGrid > * { min-width:0; }
      #heroGrid .card { padding:11px; border-radius:10px; }
      #heroGrid .title { font-size:16px; line-height:1.3; overflow-wrap:anywhere; }
      #heroGrid .desc { font-size:12px; line-height:1.45; }
      .search-input, .search-clear, .back { min-height:44px; }
      .empty-state { grid-column:1 / -1; }
    }
    @media (max-width: 339px) {
      #heroGrid { grid-template-columns:1fr !important; }
    }
  </style>
  <link rel="stylesheet" href="/function/theme.css" />
  <script src="/function/theme.js" defer></script>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1>英雄数据</h1>
      <a class="back" href="../../rukou.html">返回首页</a>
    </div>
    <div class="search-bar">
      <input id="searchInput" class="search-input" type="search" placeholder="搜索代数或英雄名" />
      <button id="clearSearchBtn" class="search-clear" type="button">清空</button>
    </div>
    <p id="searchMeta" class="search-meta"></p>
    <section class="grid" id="heroGrid"></section>
    <div id="emptyState" class="empty-state">未找到匹配内容</div>
  </main>
  <script src="hero-hub-page.js"></script>
  <script>
    initHeroHubPage();
  </script>

html[data-theme="day"] footer.wjdr-footer::before,body.theme-day footer.wjdr-footer::before{border-color:rgba(15,23,42,.14);background:rgba(255,255,255,.5);color:#64748b}

footer.wjdr-footer{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:100%;box-sizing:border-box;align-self:stretch;flex-shrink:0;margin-top:1.75rem;margin-left:0;margin-right:0;padding:14px 18px 22px;text-align:center;font-size:12px;line-height:1.65;font-weight:400;letter-spacing:.02em;-webkit-font-smoothing:antialiased;color:var(--muted,#94a3b8);border-top:1px solid var(--border,rgba(148,163,184,.28));background:rgba(15,23,42,.28)}
footer.wjdr-footer .site-footer-legal{margin:0 auto;padding:0;width:100%;max-width:min(100%,52rem);text-align:center;display:block}
@supports (text-wrap:balance){footer.wjdr-footer .site-footer-legal{text-wrap:balance}}
footer.wjdr-footer .site-footer-sep{margin:0 .35em;opacity:.45;font-weight:300}
footer.wjdr-footer a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;opacity:.95;transition:color .15s ease,opacity .15s ease}
footer.wjdr-footer a:hover{opacity:1;color:var(--text,#e2e8f0)}
html[data-theme="day"] footer.wjdr-footer{color:var(--muted,#475569);border-top-color:var(--border,rgba(15,23,42,.14));background:rgba(255,255,255,.45)}
html[data-theme="day"] footer.wjdr-footer a:hover{color:var(--text,#0f172a)}
body.theme-day footer.wjdr-footer{color:var(--muted,#64748b);border-top-color:rgba(15,23,42,.12);background:rgba(255,255,255,.35)}
body.theme-day footer.wjdr-footer a:hover{color:var(--text,#1e293b)}
@media (max-width:600px){footer.wjdr-footer{font-size:11px;padding:12px 14px 18px}}
body>footer.wjdr-footer{align-self:stretch;max-width:none}
</style>
