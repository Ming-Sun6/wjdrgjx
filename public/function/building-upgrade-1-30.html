    const tableTitleEl = document.getElementById("tableTitle");
    const rowCountEl = document.getElementById("rowCount");
    const dataBodyEl = document.getElementById("dataBody");
    const buildingSelectEl = document.getElementById("buildingSelect");
    const levelFilterEl = document.getElementById("levelFilter");

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function populateBuildingSelector() {
      Object.keys(BUILDING_DATA).forEach(function (name) {
        buildingSelectEl.add(new Option(name, name));
      });
    }

    function renderTable(buildingName) {
      const query = levelFilterEl.value.trim();
      const rows = (BUILDING_DATA[buildingName] || []).filter(function (row) {
        if (!query) return true;
        return String(row.level) === query || String(row.requirement || "").includes(query);
      });
      tableTitleEl.textContent = buildingName + " 1-30升级表";
      rowCountEl.textContent = rows.length + " 条数据";
      dataBodyEl.innerHTML = rows.map(function (row) {
        return "<tr>" +
          "<td>" + row.level + "</td>" +
          "<td>" + escapeHtml(row.food || "-") + "</td>" +
          "<td>" + escapeHtml(row.wood || "-") + "</td>" +
          "<td>" + escapeHtml(row.coal || "-") + "</td>" +
          "<td>" + escapeHtml(row.iron || "-") + "</td>" +
          "<td>" + escapeHtml(row.requirement || "-") + "</td>" +
          "<td>" + escapeHtml(row.time || "-") + "</td>" +
          "<td>" + escapeHtml(row.power || "-") + "</td>" +
        "</tr>";
      }).join("");
    }

    function renderBuildingPage() {
      const buildingName = buildingSelectEl.value;
      renderTable(buildingName);
    }

    populateBuildingSelector();
    buildingSelectEl.addEventListener("change", renderBuildingPage);
    levelFilterEl.addEventListener("input", renderBuildingPage);
    renderBuildingPage();
  </script>
