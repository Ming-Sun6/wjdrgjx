<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宠物数据查询-冬日工具箱</title>
  <script src="/function/analytics-tracker.js" defer></script>
  <link rel="stylesheet" href="/function/mobile-responsive.css" />
  <link rel="stylesheet" href="/function/theme.css" />
  <script src="/function/theme.js" defer></script>
  <style>
    :root {
      --bg: #111827;
      --bg2: #1f2937;
      --panel: rgba(15, 23, 42, 0.84);
      --line: rgba(148, 163, 184, 0.22);
      --text: #eef2ff;
      --muted: #9fb0ca;
      --accent: #5eead4;
      --warm: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 14% 8%, rgba(94, 234, 212, 0.16), transparent 24%),
        radial-gradient(circle at 82% 12%, rgba(251, 191, 36, 0.12), transparent 18%),
        linear-gradient(145deg, var(--bg), var(--bg2) 60%, #18212f);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 18px; }
    .back-link {
      display: inline-flex;
      margin-bottom: 16px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.46);
      color: var(--text);
      text-decoration: none;
    }
    .hero,
    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
    }
    .hero {
      padding: 22px;
      background: linear-gradient(135deg, rgba(94, 234, 212, 0.14), rgba(15, 23, 42, 0.9));
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 46px); }
    .sub,
    .note { color: var(--muted); line-height: 1.7; }
    .source { color: var(--warm); font-weight: 700; }
    .controls {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 12px;
      margin-top: 16px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    select,
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(8, 17, 31, 0.76);
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
    }
    .panel { margin-top: 16px; padding: 14px; overflow: hidden; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .panel-head h2 { margin: 0; font-size: 22px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; min-width: 780px; border-collapse: collapse; }
    th, td {
      padding: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: rgba(94, 234, 212, 0.10);
      color: #ccfbf1;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(94, 234, 212, 0.2);
      border-radius: 999px;
      background: rgba(94, 234, 212, 0.08);
      color: var(--text);
      font-size: 13px;
    }
    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; }
      .wrap { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back-link" href="/">返回首页</a>

    <section class="hero">
      <h1>宠物数据查询</h1>
      <p class="sub">
        按宠物查看养成材料、满级实力与突破评分，支持同组宠物共用数据切换。
        <span class="source">制作：甜甜</span>
      </p>
    </section>

    <section class="controls">
      <label>宠物 / 分组
        <select id="petSelect"></select>
      </label>
      <label>等级筛选
        <input id="levelFilter" type="search" placeholder="如 50 / 80 / 100" />
      </label>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="materialTitle">宠物养成材料</h2>
        <div class="pill">此数据为原始数据</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>等级</th>
              <th>口粮</th>
              <th>驯兽手册</th>
              <th>活力药剂</th>
              <th>强化血清</th>
              <th>等级属性</th>
              <th>洗炼属性</th>
            </tr>
          </thead>
          <tbody id="materialBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>宠物满级实力</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>宠物</th>
              <th>等级实力</th>
              <th>突破实力</th>
              <th>洗炼实力</th>
              <th>总实力</th>
            </tr>
          </thead>
          <tbody id="powerBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>宠物突破评分</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>等级</th>
              <th>评分</th>
            </tr>
          </thead>
          <tbody id="scoreBody"></tbody>
        </table>
      </div>
    </section>

    <p class="note">说明：同组宠物共用同一套养成材料数据；等级筛选同时作用于材料表、满级实力表和突破评分表。</p>
  </main>

    const petSelectEl = document.getElementById("petSelect");
    const levelFilterEl = document.getElementById("levelFilter");
    const materialTitleEl = document.getElementById("materialTitle");
    const materialBodyEl = document.getElementById("materialBody");
    const powerBodyEl = document.getElementById("powerBody");
    const scoreBodyEl = document.getElementById("scoreBody");

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildPetOptions() {
      PET_GROUPS.forEach(function (group) {
        petSelectEl.add(new Option(group.label, group.label));
      });
    }

    function currentGroup() {
      return PET_GROUPS.find(function (group) {
        return group.label === petSelectEl.value;
      }) || PET_GROUPS[0];
    }

    function matchesLevel(level) {
      const query = levelFilterEl.value.trim();
      return !query || String(level) === query;
    }

    function renderMaterials() {
      const group = currentGroup();
      materialTitleEl.textContent = group.label + " 养成材料";
      materialBodyEl.innerHTML = group.rows.filter(function (row) {
        return matchesLevel(row.level);
      }).map(function (row) {
        return "<tr>" +
          "<td>" + row.level + "</td>" +
          "<td>" + escapeHtml(row.feed || "-") + "</td>" +
          "<td>" + escapeHtml(row.book || "-") + "</td>" +
          "<td>" + escapeHtml(row.potion || "-") + "</td>" +
          "<td>" + escapeHtml(row.serum || "-") + "</td>" +
          "<td>" + escapeHtml(row.stat || "-") + "</td>" +
          "<td>" + escapeHtml(row.refine || "-") + "</td>" +
        "</tr>";
      }).join("");
    }

    function renderPowerTable() {
      const names = new Set(currentGroup().pets);
      powerBodyEl.innerHTML = PET_POWER_DATA.filter(function (row) {
        return names.has(row.pet);
      }).map(function (row) {
        return "<tr>" +
          "<td>" + escapeHtml(row.pet) + "</td>" +
          "<td>" + escapeHtml(row.levelPower) + "</td>" +
          "<td>" + escapeHtml(row.breakPower) + "</td>" +
          "<td>" + escapeHtml(row.refinePower) + "</td>" +
          "<td>" + escapeHtml(row.totalPower) + "</td>" +
        "</tr>";
      }).join("");
    }

    function renderScores() {
      scoreBodyEl.innerHTML = PET_BREAKTHROUGH_SCORES.filter(function (row) {
        return matchesLevel(row.level);
      }).map(function (row) {
        return "<tr><td>" + row.level + "</td><td>" + escapeHtml(row.score) + "</td></tr>";
      }).join("");
    }

    function renderPetPage() {
      renderMaterials();
      renderPowerTable();
      renderScores();
    }

    buildPetOptions();
    petSelectEl.addEventListener("change", renderPetPage);
    levelFilterEl.addEventListener("input", renderPetPage);
    renderPetPage();
  </script>
</body>
</html>
