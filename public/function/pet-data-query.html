    :root {

      --accent: #79e0bc;
      --accent-strong: #b2f4db;

      --row-hover: #263330;
      --shadow: 0 16px 38px rgba(0, 0, 0, 0.3);

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background-color: var(--page);
    }
    html[data-theme="night"] body,
    body.theme-night {
      background-image:
        repeating-linear-gradient(135deg, rgba(121, 224, 188, 0.035) 0 1px, transparent 1px 18px),
        linear-gradient(145deg, #0b0f10 0%, #142023 52%, #101416 100%);
    }
    html[data-theme="day"],
    body.theme-day {
      --page: #eaf2ee;
      --panel: #ffffff;
      --panel-alt: #e1eee8;
      --control: #f8fcfa;
      --line: #9eb5aa;
      --text: #193028;
      --muted: #5d7168;
      --accent: #147a5b;
      --accent-strong: #0d5e45;
      --coral: #a83c26;
      --table-head: #d5e9df;
      --row-hover: #edf7f2;
      --shadow: 0 12px 28px rgba(48, 79, 65, 0.13);
    }
    html[data-theme="day"] body,
    body.theme-day {
      background-color: #eaf2ee;
      background-image:
        repeating-linear-gradient(135deg, rgba(25, 82, 60, 0.045) 0 1px, transparent 1px 18px),

    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }
    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      margin-bottom: 18px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }
    .hero {
      padding: 24px 26px;
      border: 1px solid var(--line);
      border-top: 6px solid var(--coral);
      border-radius: 6px;
      background: linear-gradient(115deg, var(--panel-alt), var(--panel));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--coral);
      font-size: 12px;
      font-weight: 900;
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); }
    .sub,
    .note { color: var(--muted); line-height: 1.75; }
    .sub { max-width: 760px; margin: 0; }
    .source { color: var(--coral); font-weight: 800; }
    .controls {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 14px;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-alt);
      box-shadow: var(--shadow);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    :is(select, input) {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--control);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }
    :is(select, input):focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(121, 224, 188, 0.2); }
    .panel {
      margin-top: 18px;
      padding: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .panel-head h2 { margin: 0; font-size: 21px; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
    table { width: 100%; min-width: 780px; border-collapse: collapse; }
    th,
    td {
      padding: 12px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--table-head);
      color: var(--accent-strong);
      font-size: 13px;
    }
    tbody tr:nth-child(even) { background: color-mix(in srgb, var(--panel-alt) 45%, transparent); }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr:last-child td { border-bottom: 0; }
    th:first-child,
    td:first-child { position: sticky; left: 0; z-index: 1; background: var(--panel); font-weight: 800; }
    th:first-child { z-index: 3; background: var(--table-head); }
    .pill {
      display: inline-flex;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel-alt);
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 800;
    }
    .note { margin: 14px 2px 0; font-size: 13px; }
    html[data-theme="day"] .panel,

    html[data-theme="day"] td:first-child,
    body.theme-day td:first-child { background: #ffffff; }
    @media (max-width: 760px) {
      .wrap { padding: 12px; }
      .hero { padding: 20px 18px; }
      .controls { grid-template-columns: 1fr; padding: 13px; }
      .panel { padding: 12px; }
      th,
      td { padding: 11px 10px; }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildPetOptions() {
      PET_GROUPS.forEach(function (group) {
        petSelectEl.add(new Option(group.label, group.label));
      });
    }

    function currentGroup() {
      return PET_GROUPS.find(function (group) {
        return group.label === petSelectEl.value;
      }) || PET_GROUPS[0];
    }

    function matchesLevel(level) {
      const query = levelFilterEl.value.trim();
      return !query || String(level) === query;
    }

      const group = currentGroup();
      materialTitleEl.textContent = group.label + " 养成材料";

          "<td>" + escapeHtml(row.serum || "-") + "</td>" +
          "<td>" + escapeHtml(row.stat || "-") + "</td>" +
          "<td>" + escapeHtml(row.refine || "-") + "</td>" +
        "</tr>";
      }).join("");
    }

    function renderPowerTable() {
      const names = new Set(currentGroup().pets);
      powerBodyEl.innerHTML = PET_POWER_DATA.filter(function (row) {
        return names.has(row.pet);
      }).map(function (row) {
        return "<tr>" +
          "<td>" + escapeHtml(row.pet) + "</td>" +
          "<td>" + escapeHtml(row.levelPower) + "</td>" +
          "<td>" + escapeHtml(row.breakPower) + "</td>" +
          "<td>" + escapeHtml(row.refinePower) + "</td>" +
          "<td>" + escapeHtml(row.totalPower) + "</td>" +
        "</tr>";
      }).join("");
    }

    function renderScores() {
      scoreBodyEl.innerHTML = PET_BREAKTHROUGH_SCORES.filter(function (row) {
        return matchesLevel(row.level);
      }).map(function (row) {
        return "<tr><td>" + row.level + "</td><td>" + escapeHtml(row.score) + "</td></tr>";
      }).join("");
    }

    function renderPetPage() {
      renderMaterials();
      renderPowerTable();
      renderScores();
    }

    buildPetOptions();
    petSelectEl.addEventListener("change", renderPetPage);
    levelFilterEl.addEventListener("input", renderPetPage);
    renderPetPage();
  </script>
</body>
</html>
