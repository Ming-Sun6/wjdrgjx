  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

46,神话T3-3星4段,24000,300,50,8,3835000,1.598,1040,0|47,神话T4,24000,300,50,8,3876000,1.615,1050,0|48,神话T4-1段,28000,330,55,8,3916000,1.632,1060,0|49,神话T4-2段,28000,330,55,8,3957000,1.649,1070,0|50,神话T4-3段,28000,330,55,8,3998000,1.666,1080,0|51,神话T4-4段,28000,330,55,8,4039000,1.683,1090,0|52,神话T4-1星,28000,330,55,8,4080000,1.7,1100,0|53,神话T4-1星1段,32000,360,60,8,4120000,1.717,1110,0|54,神话T4-1星2段,32000,360,60,8,4161000,1.734,1120,0|55,神话T4-1星3段,32000,360,60,8,4202000,1.751,1130,0|56,神话T4-1星4段,32000,360,60,8,4243000,1.768,1140,0|57,神话T4-2星,32000,360,60,8,4284000,1.785,1150,0|58,神话T4-2星1段,36000,390,65,8,4324000,1.802,1160,0|59,神话T4-2星2段,36000,390,65,8,4365000,1.819,1170,0|60,神话T4-2星3段,36000,390,65,8,4406000,1.836,1180,0|61,神话T4-2星4段,36000,390,65,8,4447000,1.853,1190,0|62,神话T4-3星,36000,390,65,8,4488000,1.87,1200,0
        `.trim();

        const GEM_CSV = `1,5,5,0,0.09,625|2,40,15,0,0.12,1250|3,60,40,0,0.16,3125|4,80,100,0,0.19,8750|5,100,200,0,0.25,11250|6,120,300,0,0.3,12500|7,140,400,0,0.35,12500|8,200,400,0,0.4,13000|9,300,400,0,0.45,14000|10,420,420,0,0.5,15000|11,560,420,0,0.55,16000|12,580,450,15,0.64,17000|13,580,450,30,0.73,18000|14,600,500,45,0.82,19000|15,600,500,70,0.91,20000|16,650,550,100,1,21000`;

        const EQUIP = EQUIP_CSV.split("|").map((r) => {
          const x = r.split(",");
          return { seq:+x[0], st:x[1], alloy:+x[2], polish:+x[3], plan:+x[4], amber:+x[5], power:+x[6], attr:+x[7], march:+x[8], score:+x[9] };
        });
        const GEMS = GEM_CSV.split("|").map((r) => {
          const x = r.split(",");
          return { lv:+x[0], a:+x[1], b:+x[2], c:+x[3], attr:+x[4], score:+x[5] };
        });

    const equipMap = new Map(EQUIP.map((x) => [x.st, x]));
    const gemMap = new Map(GEMS.map((x) => [x.lv, x]));



    const N = (v)=>{ const n = Number(v); return Number.isFinite(n) ? n : null; };
        const F = (v,d=2)=>Number.isFinite(v) ? v.toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d}) : "--";
        const I = (v)=>Number.isFinite(v) ? v.toLocaleString("zh-CN") : "--";
        const YW = (yiVal)=>{
          if(!Number.isFinite(yiVal)) return "--";
          if(yiVal >= 1) return `${yiVal.toFixed(1)}亿`;
          return `${(yiVal * 10000).toFixed(1)}万`;
        };
        const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
        const txt = (id,v)=>{ const el = document.getElementById(id); if(el) el.textContent = String(v); };
        const sumRange = (s,e,fn)=>{ let t=0; if(e<=s) return 0; for(let i=s+1;i<=e;i++) t+=fn(i); return t; };

        function initSelect(el, opts, def){
          if(!el) return;
          el.innerHTML = opts.map((o)=>`<option value="${o.v}">${o.l}</option>`).join("");
          el.value = String(def);
        }


    function recalcEquipGem(){
          const from = equipMap.get(document.getElementById("eqFrom").value);
          const to = equipMap.get(document.getElementById("eqTo").value);
          const pieces = Math.max(1, Math.round(N(document.getElementById("eqPieces").value) ?? 1));
          let alloy=0, polish=0, plan=0, amber=0;
          if(from && to && to.seq > from.seq){
            EQUIP.forEach((r)=>{ if(r.seq > from.seq && r.seq <= to.seq){ alloy+=r.alloy; polish+=r.polish; plan+=r.plan; amber+=r.amber; } });
          }
          txt("eqAlloy", I(alloy*pieces)); txt("eqPolish", I(polish*pieces)); txt("eqPlan", I(plan*pieces)); txt("eqAmber", I(amber*pieces));
          if(from && to){
            txt("eqMeta", `属性 ${F(from.attr*100,2)}% -> ${F(to.attr*100,2)}% (Δ${F((to.attr-from.attr)*100,2)}%) | 战力 Δ${I(to.power-from.power)} | 容量 Δ${I(to.march-from.march)} | 件数 ${pieces}`);
          } else txt("eqMeta","--");

          const gf = N(document.getElementById("gemFrom").value) ?? 1;
          const gt = N(document.getElementById("gemTo").value) ?? 1;
          const gFrom = gemMap.get(gf), gTo = gemMap.get(gt);
          let m1=0,m2=0,m3=0;
          if(gt > gf){ GEMS.forEach((g)=>{ if(g.lv>gf && g.lv<=gt){ m1+=g.a; m2+=g.b; m3+=g.c; } }); }
          txt("g1", I(m1)); txt("g2", I(m2)); txt("g3", I(m3)); txt("gAttr", gFrom&&gTo ? `${F((gTo.attr-gFrom.attr)*100,2)}%` : "--");
          txt("gemMeta", gFrom&&gTo ? `属性 ${F(gFrom.attr*100,2)}% -> ${F(gTo.attr*100,2)}%，评分 ${I(gFrom.score)} -> ${I(gTo.score)}` : "--");

          if(!from||!to){ txt("equipStatus","装备数据缺失"); document.getElementById("equipStatus").className = "status bad"; }
          else if(to.seq <= from.seq){ txt("equipStatus","目标阶段未高于当前阶段，材料为 0"); document.getElementById("equipStatus").className = "status warn"; }
          else { txt("equipStatus","装备与宝石计算已更新"); document.getElementById("equipStatus").className = "status ok"; }
        }



    function init(){
      const eqOpts = EQUIP.map((x)=>({v:x.st,l:x.st}));
      initSelect(document.getElementById("eqFrom"), eqOpts, "??");
      initSelect(document.getElementById("eqTo"), eqOpts, "??");

      const gemOpts = GEMS.map((x)=>({v:x.lv,l:`Lv.${x.lv}`}));
      initSelect(document.getElementById("gemFrom"), gemOpts, 1);
      initSelect(document.getElementById("gemTo"), gemOpts, 1);

      ["eqFrom","eqTo","eqPieces","gemFrom","gemTo"].forEach((id)=>document.getElementById(id).addEventListener("input", recalcEquipGem));
      recalcEquipGem();
    }
    init();
  </script>
