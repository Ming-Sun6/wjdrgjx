<head>
  <script id="wjdr-block-ctrl-u">
  (function(){
    if(window.__wjdrBlockCtrlU)return;
    window.__wjdrBlockCtrlU=true;
    function block(e){
      if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
      if(e.key!=='u'&&e.key!=='U'&&e.code!=='KeyU')return;
      e.preventDefault();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      e.stopPropagation();
    }
    document.addEventListener("keydown",block,{capture:true,passive:false});
    window.addEventListener("keydown",block,{capture:true,passive:false});
  })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动日历-冬日工具箱</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    :root{
      --bg-night-1:#0b1220;
      --bg-night-2:#0f172a;
      --bg-day-1:#f1f5ff;
      --bg-day-2:#fefce8;
      --glow-night-1:rgba(59,130,246,.25);
      --glow-night-2:rgba(139,92,246,.22);
      --glow-day-1:rgba(56,189,248,.22);
      --glow-day-2:rgba(251,191,36,.18);
      --surface-night:rgba(15,23,42,.75);
      --surface-strong-night:rgba(30,41,59,.75);
      --surface-day:rgba(255,255,255,.78);
      --surface-strong-day:rgba(255,255,255,.9);
      --border-night:rgba(255,255,255,.12);
      --border-day:rgba(15,23,42,.12);
      --text-night:#e2e8f0;
      --text-day:#0f172a;
      --muted-night:#94a3b8;
      --muted-day:#475569;
      --accent:#3b82f6;
      --accent-2:#6366f1;
      --shadow:0 14px 35px rgba(0,0,0,.35);
      --shadow-soft:0 10px 24px rgba(15,23,42,.16);
    }
    html[data-theme="night"]{
      --bg1:var(--bg-night-1);
      --bg2:var(--bg-night-2);
      --glow-1:var(--glow-night-1);
      --glow-2:var(--glow-night-2);
      --surface:var(--surface-night);
      --surface-strong:var(--surface-strong-night);
      --border:var(--border-night);
      --text:var(--text-night);
      --muted:var(--muted-night);
      color-scheme:dark;
    }
    html[data-theme="day"]{
      --bg1:var(--bg-day-1);
      --bg2:var(--bg-day-2);
      --glow-1:var(--glow-day-1);
      --glow-2:var(--glow-day-2);
      --surface:var(--surface-day);
      --surface-strong:var(--surface-strong-day);
      --border:var(--border-day);
      --text:var(--text-day);
      --muted:var(--muted-day);
      color-scheme:light;
    }
    body{
      background:
        radial-gradient(1200px 700px at 20% 10%, var(--glow-1), transparent 55%),
        radial-gradient(900px 600px at 85% 20%, var(--glow-2), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--text);
      padding:0;
      margin:0;
      transition:background .4s ease,color .25s ease;
    }
    .page-header{
      position:fixed;
      top:0;
      right:0;
      padding:1rem 2rem;
      z-index:100;
      display:flex;
      gap:0.8rem;
      align-items:center;
    }
    .nav-link,.admin-btn{
      background-color:var(--surface);
      color:var(--text);
      border:1px solid var(--border);
      padding:0.5rem 0.9rem;
      border-radius:6px;
      cursor:pointer;
      font-size:0.9rem;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .nav-link:hover,.admin-btn:hover{background-color:rgba(59,130,246,.18);}
    .admin-btn{
      background-color:var(--accent);
      border-color:rgba(59,130,246,.55);
    }
    .admin-btn:hover{background-color:rgba(59,130,246,.85);}
    .container{
      max-width:1200px;
      margin:0 auto;
      background-color:var(--surface-strong);
      border-radius:10px;
      padding:1.5rem;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      margin-top:4.2rem;
    }
    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:1.5rem;
      padding-bottom:0.8rem;
      border-bottom:1px solid var(--border);
    }
    .nav-buttons{
      display:flex;
      gap:0.5rem;
      align-items:center;
      flex-wrap:wrap;
    }
    .nav-btn{
      background-color:var(--surface);
      color:var(--text);
      border:1px solid var(--border);
      padding:0.5rem 1rem;
      border-radius:5px;
      cursor:pointer;
    }
    .nav-btn:hover{background-color:rgba(59,130,246,.18);}
    .view-options{
      display:flex;
      gap:1rem;
      margin-bottom:1rem;
      flex-wrap:wrap;
    }
    .view-btn{
      padding:0.5rem 1rem;
      border:1px solid var(--border);
      background-color:var(--surface);
      color:var(--text);
      border-radius:5px;
      cursor:pointer;
    }
    .view-btn.active{background-color:rgba(34,197,94,.75);color:#0b1220;}
    .calendar-view{margin-top:1.5rem;}
    .month-header,.week-header{
      text-align:center;
      margin-bottom:1rem;
      padding:0.5rem;
      background-color:var(--surface);
      border-radius:5px;
    }
    .calendar-table{
      width:100%;
      border-collapse:collapse;
      margin-top:1rem;
    }
    .calendar-table th,
    .calendar-table td{
      border:1px solid var(--border);
      padding:0.5rem;
      text-align:center;
      vertical-align:middle;
    }
    .calendar-table th{
      background-color:var(--surface);
      font-weight:bold;
      color:var(--text);
    }
    .calendar-table td{
      background-color:var(--surface);
      min-height:40px;
    }
    .calendar-table td.empty{
      background-color:transparent;
      border:none;
    }
    .schedule-row{height:50px;}
    .schedule-cell{
      padding:0.5rem;
      border-radius:3px;
      font-size:0.85rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .week-calendar{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:0.5rem;
    }
    .week-day{
      display:flex;
      flex-direction:column;
      min-height:120px;
      background-color:var(--surface);
      border:1px solid var(--border);
      border-radius:5px;
      padding:0.5rem;
    }
    .week-day-header{
      text-align:center;
      font-weight:bold;
      margin-bottom:0.3rem;
    }
    .week-day-date{
      text-align:center;
      font-weight:bold;
      margin-bottom:0.3rem;
      color:var(--muted);
    }
    .week-events{
      flex-grow:1;
      overflow-y:auto;
      max-height:120px;
    }
    .day-event{
      font-size:0.75rem;
      padding:0.25rem;
      border-radius:3px;
      margin-bottom:0.25rem;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:normal;
    }
    .muted{color:var(--muted)!important;}
    .theme-toggle{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:10010;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text);
      padding:8px 12px;
      border-radius:999px;
      font-size:.8rem;
      font-weight:700;
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(10px);
      cursor:pointer;
      transition:transform .15s ease, background .2s ease, color .2s ease;
    }
    .theme-toggle:hover{transform:translateY(-1px);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    html[data-motion="on"] .container,
    html[data-motion="on"] .calendar-view,
    html[data-motion="on"] .card{
      animation:fadeUp .5s ease both;
    }

<body>
  <div class="page-header">
    <a class="nav-link" href="../rukou.html?tab=calendar">返回工具箱</a>
    <button class="admin-btn" id="adminBtn" type="button">后台管理</button>
  </div>

  <div class="container">
    <div class="header">
      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn">&lt;</button>
        <span id="currentDate"></span>
        <button class="nav-btn" id="nextBtn">&gt;</button>
      </div>
    </div>

    <div class="view-options">
      <button class="view-btn active" id="weeklyViewBtn">每周视图</button>
      <button class="view-btn" id="monthlyViewBtn">每月视图</button>
    </div>

    <div class="calendar-view">
      <h2 id="calendarTitle">每周日程视图</h2>
      <div id="calendarContainer"></div>
    </div>
  </div>

  <script>
    let currentView = 'weekly';
    let currentDate = new Date();
    let scheduleCache = [];

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentDateEl = document.getElementById('currentDate');
    const calendarTitle = document.getElementById('calendarTitle');
    const calendarContainer = document.getElementById('calendarContainer');

    function getSchedules(){
      return Array.isArray(scheduleCache) ? scheduleCache : [];
    }

    async function loadSchedules(){
      try{
        const r = await fetch('/api/calendar/schedules', { credentials: 'include' });
        if(!r.ok){ scheduleCache = []; return; }
        const d = await r.json();
        scheduleCache = Array.isArray(d.schedules) ? d.schedules : [];
      }catch(e){
        scheduleCache = [];
      }
    }

    document.getElementById('weeklyViewBtn').addEventListener('click', function(){
      currentView = 'weekly';
      updateViewButtons();
      calendarTitle.textContent = '每周日程视图';
      renderCalendarView();
    });

    document.getElementById('monthlyViewBtn').addEventListener('click', function(){
      currentView = 'monthly';
      updateViewButtons();
      calendarTitle.textContent = '每月日程视图';
      renderCalendarView();
    });

    function updateViewButtons(){
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
      if(currentView === 'weekly'){
        document.getElementById('weeklyViewBtn').classList.add('active');
      }else{
        document.getElementById('monthlyViewBtn').classList.add('active');
      }
    }

    prevBtn.addEventListener('click', function(){
      if(currentView === 'monthly'){
        currentDate.setMonth(currentDate.getMonth() - 1);
      }else{
        currentDate.setDate(currentDate.getDate() - 7);
      }
      updateCurrentDateDisplay();
      renderCalendarView();
    });

    nextBtn.addEventListener('click', function(){
      if(currentView === 'monthly'){
        currentDate.setMonth(currentDate.getMonth() + 1);
      }else{
        currentDate.setDate(currentDate.getDate() + 7);
      }
      updateCurrentDateDisplay();
      renderCalendarView();
    });

    function updateCurrentDateDisplay(){
      if(currentView === 'monthly'){
        currentDateEl.textContent = currentDate.getFullYear() + '年' + (currentDate.getMonth() + 1) + '月';
      }else{
        const startDate = getMonday(currentDate);
        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 6);
        if(startDate.getMonth() === endDate.getMonth()){
          currentDateEl.textContent = startDate.getFullYear() + '年' + (startDate.getMonth() + 1) + '月' + startDate.getDate() + '-' + endDate.getDate() + '日';
        }else{
          currentDateEl.textContent = startDate.getFullYear() + '年' + (startDate.getMonth() + 1) + '月' + startDate.getDate() + '日-' + (endDate.getMonth() + 1) + '月' + endDate.getDate() + '日';
        }
      }
    }

    function getMonday(date){
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(date);
      monday.setDate(diff);
      return monday;
    }

    function renderCalendarView(){
      if(currentView === 'weekly'){
        renderWeeklyView(calendarContainer);
      }else{
        renderMonthlyView(calendarContainer);
      }
    }

    function renderWeeklyView(container){
      const schedules = getSchedules();
      const monday = getMonday(new Date(currentDate));
      const weekYear = monday.getFullYear();
      container.innerHTML = '';

      const weekHeader = document.createElement('div');
      weekHeader.className = 'week-header';
      const headerH3 = document.createElement('h3');
      headerH3.textContent = weekYear + '年' + (monday.getMonth() + 1) + '月 第' + getWeekNumber(monday) + '周';
      weekHeader.appendChild(headerH3);
      container.appendChild(weekHeader);

      const weekDates = [];
      for(let i = 0; i < 7; i++){
        const currentDateTemp = new Date(monday);
        currentDateTemp.setDate(monday.getDate() + i);
        weekDates.push(currentDateTemp.toISOString().split('T')[0]);
      }

      const scheduleGroups = {};
      schedules.forEach(schedule => {
        const dateStr = schedule.date;
        if(weekDates.includes(dateStr)){
          const originalId = schedule.originalId || schedule.id;
          if(!scheduleGroups[originalId]) scheduleGroups[originalId] = [];
          scheduleGroups[originalId].push(schedule);
        }
      });

      const table = document.createElement('table');
      table.className = 'calendar-table';
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      weekDates.forEach(dateStr => {
        const date = new Date(dateStr);
        const th = document.createElement('th');
        th.innerHTML = date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + '<br><small>' + date.toLocaleDateString('zh-CN', { weekday: 'short' }) + '</small>';
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      const sortedGroups = Object.values(scheduleGroups).sort((a, b) => {
        const aStart = a[0].startTime || '';
        const bStart = b[0].startTime || '';
        if(!aStart && !bStart) return a[0].name.localeCompare(b[0].name);
        if(!aStart) return 1;
        if(!bStart) return -1;
        return aStart.localeCompare(bStart);
      });

      sortedGroups.forEach(group => {
        const row = document.createElement('tr');
        row.className = 'schedule-row';
        const groupDates = group.map(s => s.date).sort();
        const startDate = groupDates[0];
        const endDate = groupDates[groupDates.length - 1];
        const startCol = weekDates.indexOf(startDate);
        const endCol = weekDates.indexOf(endDate);
        const colspan = endCol - startCol + 1;

        for(let i = 0; i < startCol; i++){
          const emptyCell = document.createElement('td');
          emptyCell.className = 'empty';
          row.appendChild(emptyCell);
        }

        const scheduleCell = document.createElement('td');
        scheduleCell.className = 'schedule-cell';
        scheduleCell.colSpan = colspan;
        scheduleCell.style.backgroundColor = group[0].color;
        scheduleCell.style.color = getContrastColor(group[0].color);

        let timeText = '';
        if(group[0].startTime && group[0].endTime) timeText = '<br>' + group[0].startTime + ' - ' + group[0].endTime;
        else if(group[0].startTime) timeText = '<br>开始: ' + group[0].startTime;
        else if(group[0].endTime) timeText = '<br>结束: ' + group[0].endTime;

        scheduleCell.innerHTML = '<strong>' + escapeHtml(group[0].name) + '</strong>' + timeText;
        row.appendChild(scheduleCell);

        for(let i = endCol + 1; i < 7; i++){
          const emptyCell = document.createElement('td');
          emptyCell.className = 'empty';
          row.appendChild(emptyCell);
        }

        tbody.appendChild(row);
      });

      if(sortedGroups.length === 0){
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 7;
        cell.textContent = '本周无日程安排';
        cell.style.textAlign = 'center';
        cell.style.padding = '2rem';
        row.appendChild(cell);
        tbody.appendChild(row);
      }

      table.appendChild(tbody);
      container.appendChild(table);
    }

    function renderMonthlyView(container){
      const schedules = getSchedules();
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const firstDayOfWeek = firstDay.getDay();
      const monthDates = [];
      for(let i = 0; i < firstDayOfWeek; i++) monthDates.push(null);
      for(let day = 1; day <= daysInMonth; day++){
        monthDates.push(new Date(year, month, day).toISOString().split('T')[0]);
      }

      const scheduleGroups = {};
      schedules.forEach(schedule => {
        const dateStr = schedule.date;
        const date = new Date(dateStr);
        if(date.getFullYear() === year && date.getMonth() === month){
          const originalId = schedule.originalId || schedule.id;
          if(!scheduleGroups[originalId]) scheduleGroups[originalId] = [];
          scheduleGroups[originalId].push(schedule);
        }
      });

      container.innerHTML = '';
      const monthHeader = document.createElement('div');
      monthHeader.className = 'month-header';
      const headerH3 = document.createElement('h3');
      headerH3.textContent = year + '年' + (month + 1) + '月';
      monthHeader.appendChild(headerH3);
      container.appendChild(monthHeader);

      const table = document.createElement('table');
      table.className = 'calendar-table';
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      const weekdays = ['日','一','二','三','四','五','六'];
      for(let i = 0; i < 7; i++){
        const th = document.createElement('th');
        th.textContent = weekdays[i];
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      const totalRows = Math.ceil(monthDates.length / 7);
      for(let row = 0; row < totalRows; row++){
        const dateRow = document.createElement('tr');
        for(let col = 0; col < 7; col++){
          const index = row * 7 + col;
          const dateStr = monthDates[index];
          const cell = document.createElement('td');
          if(dateStr === null){
            cell.className = 'empty';
          }else{
            const date = new Date(dateStr);
            cell.textContent = date.getDate();
            cell.style.fontWeight = 'bold';
          }
          dateRow.appendChild(cell);
        }
        tbody.appendChild(dateRow);
      }

      const sortedGroups = Object.values(scheduleGroups).sort((a, b) => {
        const aStart = a[0].startTime || '';
        const bStart = b[0].startTime || '';
        if(!aStart && !bStart) return a[0].name.localeCompare(b[0].name);
        if(!aStart) return 1;
        if(!bStart) return -1;
        return aStart.localeCompare(bStart);
      });

      sortedGroups.forEach(group => {
        const row = document.createElement('tr');
        row.className = 'schedule-row';
        const groupDates = group.map(s => s.date).sort();
        const startDate = groupDates[0];
        const endDate = groupDates[groupDates.length - 1];
        const startIndex = monthDates.indexOf(startDate);
        const endIndex = monthDates.indexOf(endDate);
        const startRow = Math.floor(startIndex / 7);
        const endRow = Math.floor(endIndex / 7);
        const startCol = startIndex % 7;
        const endCol = endIndex % 7;

        if(startRow === endRow){
          for(let i = 0; i < startCol; i++){
            const emptyCell = document.createElement('td');
            emptyCell.className = 'empty';
            row.appendChild(emptyCell);
          }

          const scheduleCell = document.createElement('td');
          scheduleCell.className = 'schedule-cell';
          scheduleCell.colSpan = endCol - startCol + 1;
          scheduleCell.style.backgroundColor = group[0].color;
          scheduleCell.style.color = getContrastColor(group[0].color);

          let timeText = '';
          if(group[0].startTime && group[0].endTime) timeText = '<br>' + group[0].startTime + ' - ' + group[0].endTime;
          else if(group[0].startTime) timeText = '<br>开始: ' + group[0].startTime;
          else if(group[0].endTime) timeText = '<br>结束: ' + group[0].endTime;

          const displayName = group[0].name.length > 10 ? group[0].name.substring(0, 10) + '...' : group[0].name;
          scheduleCell.innerHTML = '<strong>' + escapeHtml(displayName) + '</strong>' + timeText;
          row.appendChild(scheduleCell);

          for(let i = endCol + 1; i < 7; i++){
            const emptyCell = document.createElement('td');
            emptyCell.className = 'empty';
            row.appendChild(emptyCell);
          }

          const dateRows = tbody.querySelectorAll('tr');
          if(dateRows[startRow]){
            tbody.insertBefore(row, dateRows[startRow + 1] || null);
          }else{
            tbody.appendChild(row);
          }
        }else{
          for(let i = 0; i < startCol; i++){
            const emptyCell = document.createElement('td');
            emptyCell.className = 'empty';
            row.appendChild(emptyCell);
          }

          const scheduleCell = document.createElement('td');
          scheduleCell.className = 'schedule-cell';
          scheduleCell.colSpan = 7 - startCol;
          scheduleCell.style.backgroundColor = group[0].color;
          scheduleCell.style.color = getContrastColor(group[0].color);

          let timeText = '';
          if(group[0].startTime && group[0].endTime) timeText = '<br>' + group[0].startTime + ' - ' + group[0].endTime;
          else if(group[0].startTime) timeText = '<br>开始: ' + group[0].startTime;
          else if(group[0].endTime) timeText = '<br>结束: ' + group[0].endTime;

          const displayName = group[0].name.length > 10 ? group[0].name.substring(0, 10) + '...' : group[0].name;
          scheduleCell.innerHTML = '<strong>' + escapeHtml(displayName) + '</strong>' + timeText;
          row.appendChild(scheduleCell);

          const dateRows = tbody.querySelectorAll('tr');
          if(dateRows[startRow]){
            tbody.insertBefore(row, dateRows[startRow + 1] || null);
          }else{
            tbody.appendChild(row);
          }
        }
      });

      table.appendChild(tbody);
      container.appendChild(table);
    }

    function escapeHtml(text){
      const div = document.createElement('div');
      div.textContent = text == null ? '' : text;
      return div.innerHTML;
    }

    function getWeekNumber(d){
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function getContrastColor(hexColor){
      if(!hexColor) return '#fff';
      const hex = String(hexColor).replace('#','');
      const r = parseInt(hex.substr(0,2),16);
      const g = parseInt(hex.substr(2,2),16);
      const b = parseInt(hex.substr(4,2),16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness < 125 ? '#fff' : '#000';
    }

    document.getElementById('adminBtn').addEventListener('click', function(){
      window.location.href = 'admin.html?page=calendar';
    });

    document.addEventListener('DOMContentLoaded', async function(){
      updateCurrentDateDisplay();
      await loadSchedules();
      renderCalendarView();
    });
  </script>
