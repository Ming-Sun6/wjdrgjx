<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>活动日历-冬日工具箱</title>
  <meta name="description" content="无尽冬日活动日历，支持周视图、月视图、甘特日程与每日清单。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="冬日工具箱">
  <meta property="og:title" content="活动日历-冬日工具箱">
  <meta property="og:description" content="无尽冬日活动日历，支持周视图、月视图、甘特日程与每日清单。">
  <meta property="og:url" content="https://wjgl.store/function/calendar.html">
  <meta property="og:image" content="https://wjgl.store/public/wjdr-home/%E9%9B%AA%E5%9B%BD%E7%9B%B8%E5%86%8C-%E5%88%86%E4%BA%AB.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="活动日历-冬日工具箱">
  <meta name="twitter:description" content="无尽冬日活动日历，支持周视图、月视图、甘特日程与每日清单。">
  <meta name="twitter:image" content="https://wjgl.store/public/wjdr-home/%E9%9B%AA%E5%9B%BD%E7%9B%B8%E5%86%8C-%E5%88%86%E4%BA%AB.jpg">
  <link rel="stylesheet" href="/function/calendar-gantt.css?v=20260827-11">
  <script src="/function/analytics-tracker.js?v=20260825-2" defer></script>
  <script src="/function/theme.js?v=20260501-0103" defer></script>
</head>
<body>
  <header class="calendar-page-header">
    <h1>活动日历</h1>
    <a href="/">返回主页</a>
  </header>

  <main class="calendar-shell" aria-label="活动日历">
    <div class="calendar-preview-banner" id="calendarPreviewBanner">
      <div><strong>当前为活动日历预览</strong><span>打开完整日历可查看全部功能。</span></div>
      <button class="calendar-preview-open" id="calendarOpenFull" type="button">打开完整日历</button>
    </div>
    <div class="calendar-toolbar">
      <div class="calendar-toolbar-group" aria-label="视图切换">
        <button class="calendar-btn active" id="calendarViewTimeline" type="button">默认时间轴</button>
        <button class="calendar-btn" id="calendarViewWeek" type="button">周视图</button>
        <button class="calendar-btn" id="calendarViewMonth" type="button">月视图</button>
      </div>
      <div class="calendar-toolbar-group" aria-label="日期导航">
        <button class="calendar-btn" id="calendarPrev" type="button">上一段</button>
        <button class="calendar-btn" id="calendarToday" type="button">今天</button>
        <strong class="calendar-range-label" id="calendarRangeLabel"></strong>
        <input class="calendar-picker" id="calendarWeekPicker" type="week" aria-label="选择周">
        <input class="calendar-picker" id="calendarMonthPicker" type="month" aria-label="选择月份" hidden>
        <button class="calendar-btn" id="calendarNext" type="button">下一段</button>
      </div>
    </div>
    <p class="calendar-rotate-notice">关闭手机竖屏锁定，可横屏观看日历（非微信环境）。</p>
    <p class="calendar-clamp-notice" id="calendarClampNotice" aria-live="polite"></p>
    <div class="calendar-scroll" id="calendarStatus">
      <div id="calendarGanttRoot" aria-live="polite">
        <div class="calendar-loading">进入日历后开始加载日程…</div>
      </div>
    </div>
  </main>

  <dialog class="calendar-dialog" id="calendarDetailDialog">
    <div class="calendar-dialog-body">
      <button class="calendar-dialog-close" type="button" data-calendar-dialog-close aria-label="关闭">×</button>
      <div id="calendarDialogContent"></div>
    </div>
  </dialog>

  <footer class="wjdr-footer" style="margin-top:28px;text-align:center;color:#806f63;font-size:12px">
    版权所有 © 2026 冬日工具箱 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">冀ICP备2026012727号</a>
  </footer>
  <!-- 首页使用 calendar.html?embed=1 按需加载，默认不会请求本页资源。 -->
  <script src="/function/calendar-gantt.js?v=20260827-13"></script>
  <script>
    (() => {
      const dedupeTimeline = () => document.querySelectorAll('.calendar-timeline-lane').forEach(lane => {
        const seen = new Set();
        [...lane.querySelectorAll('.calendar-timeline-bar')].forEach(bar => {
          const key = `${bar.textContent}|${bar.style.gridColumn}`;
          if (seen.has(key)) bar.remove(); else seen.add(key);
        });
      });
      new MutationObserver(dedupeTimeline).observe(document.getElementById('calendarGanttRoot'), { childList: true, subtree: true });
      dedupeTimeline();
    })();
  </script>
</body>
</html>
