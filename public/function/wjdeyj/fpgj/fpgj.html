<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云机分配工具</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #1e293b;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 52%, #ecfdf5 100%);
    }
    main { width: min(760px, 100%); }
    h1 { margin: 0 0 10px; text-align: center; font-size: clamp(28px, 6vw, 42px); }
    p { margin: 0 0 30px; text-align: center; color: #64748b; }
    .tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    a {
      display: flex;
      min-height: 150px;
      align-items: center;
      justify-content: center;
      padding: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    a:first-child { background: linear-gradient(135deg, #4f46e5, #2563eb); }
    a:last-child { background: linear-gradient(135deg, #059669, #10b981); }
    a:hover { transform: translateY(-3px); box-shadow: 0 18px 36px rgba(15, 23, 42, 0.18); }
    a:focus-visible { outline: 4px solid #f59e0b; outline-offset: 4px; }
    @media (max-width: 600px) {
      .tools { grid-template-columns: 1fr; }
      a { min-height: 120px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>云机分配工具</h1>
    <p>请选择需要使用的分配系统</p>
    <div class="tools">
      <a href="ai.html">AI云手机分配系统</a>
      <a href="v2.6.html">最强冬日卡密分配工具</a>
    </div>
  </main>
  <script src="/function/analytics-tracker.js"></script>
</body>
</html>
